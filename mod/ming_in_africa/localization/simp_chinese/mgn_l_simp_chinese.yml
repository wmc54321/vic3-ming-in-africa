 mgn_chinese_subjugation: "中华臣服"
 mgn_chinese_subjugation_desc: "迫使对方中华朝廷承认本朝居于正统上位，并接受臣属名分。"
 mgn_brotherly_vassalization: "兄弟皇谊"
 mgn_brotherly_vassalization_desc: "以兄弟皇谊之名，迫使对方中华朝廷接受朝贡或附庸名分。"
 war_goal_mgn_brotherly_vassalization_type_name: "兄弟皇谊"
 war_goal_mgn_brotherly_vassalization: "兄弟皇谊"
 war_goal_mgn_brotherly_vassalization_desc: "迫使对方中华朝廷接受朝贡或附庸名分。"
 mgn_open_chinese_migration: "要求弛禁迁徙"
 mgn_open_chinese_migration_desc: "迫使对方中华朝廷弛禁迁徙，使商民、劳工与亲族得以重过关津。"
 mgn_regulate_chinese_migration: "要求厘定迁徙章程"
 mgn_regulate_chinese_migration_desc: "迫使对方中华朝廷厘定迁徙章程，以户籍、路引与关津文书约束跨境流动。"
 mgn_close_chinese_migration: "要求闭关封境"
 mgn_close_chinese_migration_desc: "迫使对方中华朝廷闭关封境，把人口流动重新纳入关防与官府许可。"
 mgn_two_chinas_independence: "要求独立"
 mgn_two_chinas_independence_desc: "使臣服的中华朝廷摆脱对方宗主权，重新以本朝名义宣称天命。"

 je_mgn_two_chinas: "两个中华"
 je_mgn_two_chinas_reason: "非洲的大明与亚洲的大清都自称承继中华正统。两朝可以暂且并立，也可以用宗藩名分、兵锋、迁徙章程或政制合流来决定谁有资格代表天下。"
 je_mgn_two_chinas_lobby: "非洲的大明与亚洲的大清各奉一统，各称天命。选择尼罗河畔的海外明廷，或坐拥神州的大清，在宗藩礼法、人口迁徙、政治合流与统一战争之间重定中华正统。"
 objective_mgn_two_chinas: "两个中华"
 objective_mgn_two_chinas_desc: "大明在尼罗河畔延续国祚，大清则统治亚洲中国。选择两个朝廷之一，在并立、臣服、合流或战争之间决定谁能代表天下。"
 objective_mgn_two_chinas_idle_header: "重定天下正统"
 objective_mgn_two_chinas_idle_hint: "继续推进“两个中华”日志中的宗藩、迁徙、合流或统一路线"
 objective_mgn_two_chinas_name_MGN: "#v $MGN$#!"
 objective_mgn_two_chinas_desc_MGN: "#lore 从应天府与尼罗河畔出发，经营非洲新中原，并决定是与大清并立、迫其臣服，还是渡海重定山河。#!"
 objective_mgn_two_chinas_name_CHI: "#v $dyn_c_great_qing$#!"
 objective_mgn_two_chinas_desc_CHI: "#lore 坐拥神州的大清必须回应海外明廷的正统挑战：以宗藩收束两朝、寻求政制合流，或出兵平定非洲。#!"
 je_mgn_rebuild_state_ming: "重建国家"
 je_mgn_rebuild_state_ming_reason: "大明已重定海内。朝廷必须决定天命落在何处，厘定京师所在，并重新整理东北与西北的版籍。"
 je_mgn_rebuild_state_qing: "重建国家"
 je_mgn_rebuild_state_qing_reason: "大清已压服海外明廷，却仍须重整统一后的中央秩序，并重新厘定东北与西北旧疆的版籍。"
 je_mgn_administer_four_quarters: "经略四方"
 je_mgn_administer_four_quarters_reason: "居于天下上位的朝廷，可以把已经控制、却远离中枢的领土依当地形势与新生中华文化编为属国公司。公司代行经营、征收与地方整合，仍须奉天朝名分与章程。"
 je_mgn_bitter_peace: "苦涩的和平"
 je_mgn_bitter_peace_reason: "朝廷仍称中华正统，国书上却已有了宗主的名分。只要兵戈停息、外交博弈结束且停战期已过，忍下的和平仍可以被重新掀开。"

 button_mgn_launch_ming_reconquest: "发起反攻大陆"
 button_mgn_launch_ming_reconquest_desc: "大明若已压过大清，又没有战争或停战束缚，就可正式发起反攻。两国都将把统一中华写进战争目标，天下不会再容纳两个正统。"
 button_mgn_launch_qing_conquest: "发起武力统一"
 button_mgn_launch_qing_conquest_desc: "大清若已压过大明，又没有战争或停战束缚，就可出兵平定海外明廷。两国都将以统一中华为名开战。"
 button_mgn_claim_ming_reconquest_complete: "海内一统"
 button_mgn_claim_ming_reconquest_complete_desc: "亚洲大清已成旧事，大明可以开始重建统一后的国家秩序。"
 button_mgn_claim_qing_conquest_complete: "海内一统"
 button_mgn_claim_qing_conquest_complete_desc: "非洲明廷已被平定，大清可以开始安置海外旧土。"
 button_mgn_recognize_brotherly_hierarchy: "提议兄弟皇谊"
 button_mgn_recognize_brotherly_hierarchy_desc: "当两国仍保有君主、神权或社会君主原则时，强盛一方可以把优势写成宗藩礼法，要求对方以朝贡或附庸身份承认尊卑。"
 button_mgn_request_open_migration: "要求弛禁迁徙"
 button_mgn_request_open_migration_desc: "要求另一个中华废除迁徙禁令，让商民、劳工与亲族重新穿过关津。弱势朝廷若不愿照办，就只能让战场裁断边境章程。"
 button_mgn_request_regulated_migration: "要求厘定迁徙章程"
 button_mgn_request_regulated_migration_desc: "要求另一个中华采用迁徙章程，把人口流动纳入户籍、路引和官府文书。拒绝者等同拒绝承认本朝的制度号令。"
 button_mgn_request_closed_migration: "要求闭关封境"
 button_mgn_request_closed_migration_desc: "要求另一个中华闭关封境，阻断未经许可的越界迁徙。若对方坚持开边，争端将从户籍册转入战书。"
 button_mgn_launch_peaceful_unification: "提议和平统一"
 button_mgn_launch_peaceful_unification_desc: "在两国关系友善、政治制度相容且强弱已分时，向另一个中华提出合流。君主制、社会君主制与法团国家可以彼此合流；双方只需同为有选举或同为无选举，不必采用同一种制度。地产、财产、资格、普选和一党制都算有选举。其他政体则必须采用完全相同的治理原则。若对方已臣服，还需累计臣服满五年。"
 button_mgn_request_independence: "要求独立"
 button_mgn_request_independence_desc: "在兵戈、外交博弈与停战约束都暂时消退时，向宗主宣告本朝不再愿以臣属身份延续和平。"
 mgn_can_claim_ming_reconquest_complete_tt: "亚洲大清已不存在"
 mgn_can_claim_qing_conquest_complete_tt: "非洲大明已不存在，且大清仍是有效的中华中央政府"
 mgn_can_request_independence_from_other_china_tt: "臣服一方与宗主均未参战或卷入外交博弈，并且双方没有停战协议"
 mgn_tt_two_chinas_peace_tt: "双方均未参战，也未卷入外交博弈"
 mgn_tt_two_chinas_no_truce_tt: "双方没有停战协议"
 mgn_tt_higher_rank_than_other_china_tt: "本国国际地位高于另一个中华"
 mgn_tt_no_force_unification_in_progress_tt: "目前没有尚待裁断的统一战争要求"
 mgn_tt_ritual_monarchies_not_subjects_tt: "双方均保有君主、神权或社会君主原则，且互不臣属"
 mgn_tt_no_brotherly_hierarchy_in_progress_tt: "目前没有尚待答复的兄弟皇谊提议"
 mgn_tt_amicable_and_unifiable_government_tt: "双方关系达到友善；君主制、社会君主制和法团国家可彼此合流，但双方须同为有选举或同为无选举（地产、财产、资格、普选、一党制均算有选举）；其他政体须采用完全相同的治理原则"
 mgn_tt_rank_or_five_year_subject_union_tt: "本国国际地位更高；若对方已臣服，则需累计臣服满五年"
 mgn_tt_no_peaceful_unification_in_progress_tt: "目前没有尚待答复的和平统一提议"
 mgn_tt_rank_or_overlord_for_migration_tt: "本国国际地位更高，或是另一个中华的宗主"
 mgn_tt_migration_policy_differs_tt: "两国移民政策不同"
 mgn_tt_no_migration_policy_alignment_in_progress_tt: "目前没有尚待答复的迁徙章程要求"
 mgn_chinese_chartered_company_cannot_form_china_tt: "#bold 中华属特许公司#!不能成立中国"
 button_mgn_move_capital_beijing: "迁都北京"
 button_mgn_move_capital_beijing_desc: "将首都与市场首都迁往北京，让朝廷重新坐回北方旧都与传统中原轴心。"
 button_mgn_move_capital_nanjing: "迁都南京"
 button_mgn_move_capital_nanjing_desc: "将首都与市场首都迁往南京，以江南旧都统合海内文书与海外记忆。"
 button_mgn_move_capital_yingtian: "迁都应天府"
 button_mgn_move_capital_yingtian_desc: "将首都与市场首都迁往北非埃及的应天府，宣告尼罗河畔也可以成为天下中枢。"
 button_mgn_establish_african_company_ming: "设立非洲榷务公司"
 button_mgn_establish_african_company_ming_desc: "当朝廷离开非洲而仍控制当地领土时，可把旧日根基交给非洲榷务公司经营。汉家官商与非洲中华、西域中华共同承接旧有户籍和税网，公司则奉行天朝万民与盘剥经济制度。"
 button_mgn_establish_african_company_qing: "设立非洲榷务公司"
 button_mgn_establish_african_company_qing_desc: "当大清控制非洲旧土，却不愿将其直接编为寻常行省时，可设立非洲榷务公司。汉家官商与当地新生中华共同代行征收、经营与镇抚。"
 button_mgn_establish_mainland_company: "设立内地经略公司"
 button_mgn_establish_mainland_company_desc: "设立内地经略公司，代朝廷经理中华内地及西北、东北边疆的钱粮、矿务、关防与驿路。它以汉家官商为骨架，用账册把旧疆重新缝合。"
 button_mgn_establish_korean_company: "设立东藩榷务公司"
 button_mgn_establish_korean_company_desc: "设立东藩榷务公司，接管朝鲜诸道的税务、港务和藩务整饬。汉家官商与海东中华士绅共理公司衙署，以关津、账册与新章承接旧日礼仪。"
 button_mgn_establish_lanfang_company: "设立兰芳榷务公司"
 button_mgn_establish_lanfang_company_desc: "设立兰芳榷务公司，把婆罗洲港口、矿山和会馆商路纳入天朝牌照之下。汉家官商与南洋中华承接客商公议和本地盟约，再以公司账册统合其利权。"
 button_mgn_establish_siberian_company: "设立西伯利亚榷务公司"
 button_mgn_establish_siberian_company_desc: "设立西伯利亚榷务公司，以驿路、矿山、皮货和屯垦经营北境雪原。汉家官商与朔方中华共理北亚章程；图瓦仍归内地经略范围。"
 button_mgn_restore_northeastern_border: "恢复东北边界"
 button_mgn_restore_northeastern_border_desc: "旧日东北疆界散落在藩属治下。朝廷可重定版籍，使旧疆依次归于仍存续的大清、内地经略公司或大明中央。"
 button_mgn_restore_northwestern_border: "恢复西北边界"
 button_mgn_restore_northwestern_border_desc: "西北诸地久由藩属分治。朝廷可依旧疆重订版籍，使旧疆依次归于仍存续的大清、内地经略公司或大明中央，并整理吉尔吉斯州中原属大清的一隅。"
 mgn_restore_northeastern_border_effect_tt: "整顿东北版籍：外满洲与阿穆尔旧疆优先归大清；大清不存续时归内地经略公司；两者均不存在时归大明直辖。"
 mgn_restore_northwestern_border_effect_tt: "整顿西北版籍：旧疆优先归大清；大清不存续时归内地经略公司；两者均不存在时归大明直辖。吉尔吉斯州仍依1836年的旧界划分。"
 button_mgn_establish_central_asian_company: "设立中亚榷务公司"
 button_mgn_establish_central_asian_company_desc: "设立中亚榷务公司，以绿洲、驼道、矿山和水渠经营西域旧路。汉家官商与天山中华把地方根基、儒家礼制和公司账册联结起来。"
 button_mgn_establish_japanese_company: "设立扶桑榷务公司"
 button_mgn_establish_japanese_company_desc: "设立扶桑榷务公司，将北海道至九州的日本本土纳入特许经营。汉家官商与扶桑中华以日语接续武家、商社和城市官署；宗主控制的琉球则随内地经略公司另行治理。"
 button_mgn_establish_southeast_asian_company: "设立南洋经略公司"
 button_mgn_establish_southeast_asian_company_desc: "设立南洋经略公司，统筹缅甸、暹罗、老挝、柬埔寨、越南与马来半岛的税关、河运和商路。汉家官商与交南中华以越语和儒学文书沟通诸国旧制；婆罗洲仍归兰芳公司。"
 mgn_has_african_company_land_tt: "本国或臣属体系中的非公司政权控制任意非洲领土"
 mgn_has_mainland_company_land_tt: "本国或臣属体系中的非公司政权控制任意内地、吉尔吉斯、伊犁、图瓦、西藏、库页岛或琉球领土"
 mgn_has_korean_company_land_tt: "本国或臣属体系中的非公司政权控制任意朝鲜领土"
 mgn_has_lanfang_company_land_tt: "本国或臣属体系中的非公司政权控制任意婆罗洲领土"
 mgn_has_siberian_company_land_tt: "本国或臣属体系中的非公司政权控制任意除图瓦外的西伯利亚领土"
 mgn_has_central_asian_company_land_tt: "本国或臣属体系中的非公司政权控制任意中亚领土"
 mgn_has_japanese_company_land_tt: "本国或臣属体系中的非公司政权控制任意日本本土领土（不含琉球）"
 mgn_has_southeast_asian_company_land_tt: "本国或臣属体系中的非公司政权控制任意大陆东南亚或马来半岛领土"
