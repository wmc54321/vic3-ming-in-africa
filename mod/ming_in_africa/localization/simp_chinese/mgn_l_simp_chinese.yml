 mgn_heavenly_court_in_africa: "天朝在非洲"
 mgn_heavenly_court_in_africa_desc: "大明的诏令能抵达非洲各地，却未必能立刻变成道路、税册和乡约。辽阔疆域仍在学习如何听命于同一座朝廷。"
 mgn_southern_court_administration: "南都行台"
 mgn_southern_court_administration_desc: "行台、军府、黄册和士绅包办让朝廷暂时撑住了跨洲统治。等临时差役变成常例，地方利益也会慢慢把这股效率磨平。"
 mgn_brotherly_hierarchy_recognized: "兄弟皇谊"
 mgn_brotherly_hierarchy_recognized_desc: "两个中华以宗藩名分暂定尊卑。胜负被写成礼法，臣服被称作兄弟，至少在国书上如此。"
 mgn_chinese_unification_integration_drive: "海内整合"
 mgn_chinese_unification_integration_drive_desc: "海内重新合于一统，朝廷把官吏、文书和地方钱粮集中起来，趁天下尚知变局未定，尽快把新领土纳入常制。"

 law_mgn_heavenly_subjecthood: "天朝万民"
 law_mgn_heavenly_subjecthood_desc: "皇帝以天朝名分统合诸民。四方百姓可以入籍、服役、读书和仕进，却仍被安置在清楚的等级与礼法之中。"
 law_mgn_huayi_unity: "华夷一统"
 law_mgn_huayi_unity_desc: "朝廷把“天下一家”从皇帝的德目改造成国家的制度承诺。不同族群共享同一公共身份，也在学校、礼法和行政里被慢慢织进同一套秩序。"
 law_mgn_overseas_cooperative_ownership: "人民资本合作制"
 law_mgn_overseas_cooperative_ownership_desc: "国家以人民合作之名重组海内产业，使国内工厂归劳动者共同所有；海外投资则仍借私人资本周转，让外洋贸易保留必要的弹性。"
 law_mgn_overseas_cooperative_ownership_foreign_tt: "本国国内产业按合作社所有制集体化；海外投资不会获得合作社所有制的海外集体化许可。"
 ideology_mgn_tianxia_order: "天下秩序"
 ideology_mgn_tianxia_order_desc: "该集团相信大明的正统不只来自血缘，也来自能否把四方诸民纳入天朝秩序。"
 ideology_mgn_overseas_reform: "海外维新"
 ideology_mgn_overseas_reform_desc: "该集团认为海外大明必须用更包容、更务实的制度来维持跨洲国家。"
 ideology_mgn_maritime_opening: "市舶开明"
 ideology_mgn_maritime_opening_desc: "该集团支持为贸易、航运和移民网络打开身份壁垒。"

 building_mgn_forbidden_city: "应天府紫禁城"
 building_mgn_forbidden_city_desc: "尼罗河畔的新宫城仿北京旧制而建。它告诉臣民，非洲不再只是播迁之地，而是朝廷重新丈量天下的中枢。"
 building_mgn_nanjing_forbidden_city: "南京紫禁城"
 building_mgn_nanjing_forbidden_city_desc: "江南旧都重起宫城，洪武旧制与海外朝廷的记忆在此合流。南京再次成为文书、礼仪与天命归心之所。"
 HUB_NAME_STATE_LOWER_EGYPT_city_mgn: "应天府"
 HUB_NAME_STATE_LOWER_EGYPT_port_mgn: "靖海港"

