 mgn_establish_japanese_company_effect_tt: "颁给扶桑榷务公司特许状；日本本土章程范围内的领土将移交并完成整合。"
 mgn_establish_southeast_asian_company_effect_tt: "颁给南洋经略公司特许状；大陆东南亚与马来半岛章程范围内的领土将移交并完成整合。"

 mgn_route_events.10.t: "海内一统"
 mgn_route_events.10.d: "亚洲大清已不复存在，大明成为唯一仍能宣称中华正统的国家。"
 mgn_route_events.10.f: "曾被称作海外朝廷的国家，如今把诏书重新写回海内。胜利并不等于旧制自然复原，宫阙、户籍、疆界与名分都等待重排。"
 mgn_route_events.10.a: "让天下重归章程。"
 mgn_route_events.20.t: "海内一统"
 mgn_route_events.20.d: "大清已平定非洲明廷，海外的天命宣称者不复独立。"
 mgn_route_events.20.f: "横跨印度洋的旧日挑战者终于伏于大清名下。但非洲不能只凭一道诏书便化作寻常州县，朝廷仍须决定如何继承旧制、征收财赋与维持远疆。"
 mgn_route_events.20.a: "安置海外旧土。"
 mgn_route_events.30.t: "迁都北京"
 mgn_route_events.30.d: "大明将首都迁回北京。"
 mgn_route_events.30.f: "宫阙、部院与档案被带回北方旧都。大明以北京承接旧日中原的制度惯性，也把海外岁月收束为一段漫长的播迁。"
 mgn_route_events.30.a: "定鼎于此。"
 mgn_route_events.31.t: "迁都南京"
 mgn_route_events.31.d: "大明将首都迁往南京。"
 mgn_route_events.31.f: "江南旧都再次成为朝廷所在。北京的北望、应天府的远航，都被收进南京的六部案牍与江海粮道之中。"
 mgn_route_events.31.a: "定鼎于此。"
 mgn_route_events.32.t: "迁都应天府"
 mgn_route_events.32.d: "大明将首都定于北非埃及的应天府。"
 mgn_route_events.32.f: "朝廷没有把非洲旧土交还给流放与记忆。尼罗河水道、红海商路、撒哈拉驿站与新建宫阙一并纳入王畿；从此中原不只在黄河与江淮之间，也在应天府的城门与沙海边关之间。"
 mgn_route_events.32.a: "此亦中原。"
 mgn_route_events.40.t: "非洲榷务公司"
 mgn_route_events.40.d: "大明将非洲旧土交给非洲榷务公司经营。"
 mgn_route_events.40.f: "行台的户籍、税册和地方网络并未消失，只是换上了公司印信。汉家官商与非洲中华、西域中华承接旧日根基，也让土地、劳役和商路接受更严苛的榷务章程。"
 mgn_route_events.40.a: "海外旧土，自有章程。"
 mgn_route_events.50.t: "非洲榷务公司"
 mgn_route_events.50.d: "大清将非洲旧土交给非洲榷务公司经营。"
 mgn_route_events.50.f: "海内一统之后，非洲仍隔着海路、沙漠与迥异的地方秩序。汉家官商与当地新生中华进入公司衙署，替朝廷经理财赋、商路与边地秩序。"
 mgn_route_events.50.a: "准其开办。"
 mgn_route_events.140.t: "内地经略公司"
 mgn_route_events.140.d: "朝廷将一批旧疆交给内地经略公司经营。"
 mgn_route_events.140.f: "关津、粮道、矿务与盐课被编入新的公司章程。汉家官商仍奉天朝名分，却以账册、股本与契约重织旧疆。"
 mgn_route_events.140.a: "以利权经略内地。"
 mgn_route_events.141.t: "东藩榷务公司"
 mgn_route_events.141.d: "朝廷将朝鲜诸道交给东藩榷务公司经营。"
 mgn_route_events.141.f: "朝鲜诸道不再只由旧日藩礼维系。汉家官商与海东中华士绅共入公司衙署，将港口、贡道与税册并入天朝经略，也把本地制度写进新章。"
 mgn_route_events.141.a: "东藩自有新章。"
 mgn_route_events.144.t: "兰芳榷务公司"
 mgn_route_events.144.d: "朝廷将婆罗洲相关领地交给兰芳榷务公司经营。"
 mgn_route_events.144.f: "婆罗洲港口、矿山与会馆商路被交给兰芳公司经营。汉家官商与南洋中华以客商旧约和本地盟约为根，再以天朝新章将海路利权编入一册账簿。"
 mgn_route_events.144.a: "准其经理南洋。"
 mgn_route_events.142.t: "西伯利亚榷务公司"
 mgn_route_events.142.d: "朝廷将北境领地交给西伯利亚榷务公司经营。"
 mgn_route_events.142.f: "雪原、针叶林与寒海口岸被纳入一套边疆账簿。汉家官商与朔方中华依托驿站、矿区和河谷，以礼制、皮货贸易与屯垦维持北境秩序；图瓦不在其章程之内。"
 mgn_route_events.142.a: "经略西伯利亚。"
 mgn_route_events.143.t: "中亚榷务公司"
 mgn_route_events.143.d: "朝廷将中亚领地交给中亚榷务公司经营。"
 mgn_route_events.143.f: "绿洲、草原与旧商道被交给公司衙署管理。汉家官商与天山中华以地方根基承接天朝礼制，再用账册清点驼队、矿山与水渠。"
 mgn_route_events.143.a: "经略中亚。"
 mgn_route_events.145.t: "扶桑榷务公司"
 mgn_route_events.145.d: "朝廷将日本本土的相关领地交给扶桑榷务公司经营。"
 mgn_route_events.145.f: "从北海道到九州，港口、城下町和商社被编入同一份特许章程。汉家官商与扶桑中华以日语接续本地制度，让武家名分、城市账簿和天朝印信同见于一纸公文；宗主控制的琉球则随内地经略公司另行治理。"
 mgn_route_events.145.a: "经略扶桑。"
 mgn_route_events.146.t: "南洋经略公司"
 mgn_route_events.146.d: "朝廷将大陆东南亚与马来半岛的相关领地交给南洋经略公司经营。"
 mgn_route_events.146.f: "伊洛瓦底江、湄南河、湄公河与红河的税关被写进同一册章程。汉家官商与交南中华以越语和儒学文书沟通诸国旧制，公司船队则把内陆商路接到马六甲海峡。"
 mgn_route_events.146.a: "经略南洋。"
 mgn_route_events.60.t: "兄弟皇谊"
 mgn_route_events.60.d: "两个中华以宗藩名分暂定尊卑。"
 mgn_route_events.60.f: "朝廷文书称之为兄弟皇谊。两朝实际的强弱被礼制包裹，战败与臣服则写成同源皇统之间尚可维持体面的尊卑之约。"
 mgn_route_events.60.a: "以礼定分。"
 mgn_route_events.100.t: "和平统一提议"
 mgn_route_events.100.d: "大明提议两国和平合流。"
 mgn_route_events.100.f: "双方政体已经趋同，边境上的敌意也暂时退去。非洲朝廷认为，中华不必继续由两套官署、两套军队和两份正统宣言维持。"
 mgn_route_events.100.a: "接受合流。"
 mgn_route_events.100.b: "拒绝，准备战争。"
 mgn_route_events.101.t: "和平统一提议"
 mgn_route_events.101.d: "大清提议两国和平合流。"
 mgn_route_events.101.f: "双方政体已经趋同，旧日敌意也被现实磨钝。北京朝廷认为，海外明廷可以不经兵戈而归入统一国家。"
 mgn_route_events.101.a: "接受合流。"
 mgn_route_events.101.b: "拒绝，准备战争。"
 mgn_route_events.110.t: "兄弟皇谊提议"
 mgn_route_events.110.d: "大明要求大清以朝贡国或附庸身份承认宗藩名分。"
 mgn_route_events.110.f: "来使把强弱写成礼制，把臣服称作兄弟皇谊。接受，尚可保有宗庙名号；拒绝，便让兵戈解释礼法。"
 mgn_route_events.110.a: "接受兄弟皇谊。"
 mgn_route_events.110.b: "拒绝，准备战争。"
 mgn_route_events.111.t: "兄弟皇谊提议"
 mgn_route_events.111.d: "大清要求大明以朝贡国或附庸身份承认宗藩名分。"
 mgn_route_events.111.f: "来使把强弱写成礼制，把臣服称作兄弟皇谊。接受，尚可保有宗庙名号；拒绝，便让兵戈解释礼法。"
 mgn_route_events.111.a: "接受兄弟皇谊。"
 mgn_route_events.111.b: "拒绝，准备战争。"
 mgn_route_events.120.t: "边境移民政策要求"
 mgn_route_events.120.d: "大明要求大清修改边境移民政策。"
 mgn_route_events.120.f: "非洲朝廷称，两国若同奉中华正统，边境与户籍迁徙之法也应随强盛一方重定。"
 mgn_route_events.120.a: "采用大明的移民政策。"
 mgn_route_events.120.b: "拒绝，准备战争。"
 mgn_route_events.121.t: "边境移民政策要求"
 mgn_route_events.121.d: "大清要求大明修改边境移民政策。"
 mgn_route_events.121.f: "北京朝廷称，两国若同奉中华正统，边境与户籍迁徙之法也应随强盛一方重定。"
 mgn_route_events.121.a: "采用大清的移民政策。"
 mgn_route_events.121.b: "拒绝，准备战争。"
 mgn_migration_policy_alignment_rejected: "边境移民政策争端"
 mgn_route_events.130.t: "苦涩的和平"
 mgn_route_events.130.d: "本朝暂居另一个中华朝廷的宗主权之下。"
 mgn_route_events.130.f: "礼书仍称兄弟，册命却写明尊卑。朝廷可以忍受今日的和平，但这份和平并不甘美。"
 mgn_route_events.130.a: "忍辱待时。"
 mgn_independence_demand: "两中华独立要求"

 law_mgn_revolutionary_committees: "革命委员会制"
 law_mgn_revolutionary_committees_desc: "旧有的行政机关已经不能适应继续革命的需要。各级革命委员会由革命干部、群众代表和军队代表实行三结合，统一行使党政权力。各派群众均可参加革命大联合，并在辨明正确路线后形成一致意见。革命不应止步于政府机关，工厂、矿山和任何身居高位者同样要接受群众监督。"
 mgn_revolutionary_committees_special_unlocks_tt: "可以制定#bold 工厂委员会#!法律，并解锁对本国人物的#bold 批斗#!互动；批斗仅在革命委员会制生效时显示"
 mgn_factory_councils_revolutionary_or_committees_tt: "国家处于革命中，或者已经实行革命委员会制"

 law_mgn_national_tutelage: "国民训政制"
 law_mgn_national_tutelage_desc: "革命尚未完成，宪政亦未告成。国民政府以党治国，统合党、政、军各机关，训练人民行使民权，并依五权宪法筹设行政、立法、司法、考试与监察诸院。待地方自治完备、国民具备行使政权之能力，即当结束训政；至于完成之日，则由中央执行委员会审时度势。"
 mgn_national_tutelage_special_unlocks_tt: "解锁#bold 训政时期#!日志，可以宣布或解除#bold 全国戒严#!；戒严期间定期选举将延期举行"
 je_mgn_national_tutelage: "训政时期"
 je_mgn_national_tutelage_reason: "国民政府正在训练人民行使民权，并依五权宪法筹备未来宪政。政府可以在非常时期宣布全国戒严，将定期选举延期至戒严解除；非常时期预计结束日期另行公告，历次检讨均确认其仍有继续之必要。"
 button_mgn_declare_martial_law: "宣布全国戒严"
 button_mgn_declare_martial_law_desc: "鉴于国内外形势依然严峻，政府将依法进入动员戡乱时期。定期选举延期举行，恢复日期另行公告。戒严至少持续两年。"
 button_mgn_lift_martial_law: "解除全国戒严"
 button_mgn_lift_martial_law_desc: "国家已具备恢复定期选举的充分条件。解除戒严，并于六个月后举行选举，以检验训政成果。此后两年内不得重新宣布戒严。"
 mgn_tt_not_in_election_campaign: "当前不在选举活动期间"
 mgn_tt_martial_law_reimposition_ready: "解除戒严至少已满两年"
 mgn_tt_martial_law_minimum_elapsed: "戒严至少已持续两年"
 mgn_tt_not_in_civil_war: "国家未处于内战之中"
 mgn_tt_no_revolution_brewing: "国内没有正在酝酿的革命"
 mgn_mobilization_period: "动员戡乱时期"
 mgn_mobilization_period_desc: "戒严并非停止训政，而是为了排除妨碍国民接受训政的一切因素。定期选举将延期至非常时期结束后举行。"

 mgn_struggle_session: "批斗"
 mgn_struggle_session_desc: "#lore 发动群众揭发并批判[Character.GetFullName]所执行的错误路线。批斗必将终结其政治生涯，但群众运动一旦开始，结局便不完全由革命委员会决定。#!\n\n@warning! 目标将被撤职、流放或在批斗中死亡，具体结果无法预料。"
 mgn_revolutionary_committee_events.1.t: "打倒[SCOPE.sCharacter('mgn_struggle_target').GetFullName]！"
 mgn_revolutionary_committee_events.1.d: "在持续数日的批判大会后，[SCOPE.sCharacter('mgn_struggle_target').GetFullName]终于承认自己在若干重大问题上犯有严重的路线错误。会场随即通过决议，撤销其一切职务，并责令其在劳动中重新认识群众。至于具体犯过哪些错误，革命委员会认为，没有必要让技术细节妨碍原则问题的解决。"
 mgn_revolutionary_committee_events.1.a: "革命群众的眼睛是雪亮的。"
 mgn_revolutionary_committee_events.2.t: "保护性隔离"
 mgn_revolutionary_committee_events.2.d: "批斗大会的气氛已经超出主持者的预期。为了保护革命成果，也为了保护[SCOPE.sCharacter('mgn_struggle_target').GetFullName]免受革命群众进一步的自发保护，革命委员会决定立即将其转移至一处不公开地点接受审查。"
 mgn_revolutionary_committee_events.2.a: "这是必要的保护。"
 mgn_revolutionary_committee_events.3.t: "群众义愤"
 mgn_revolutionary_committee_events.3.d: "在批斗过程中，会场一度陷入混乱。秩序恢复后，[SCOPE.sCharacter('mgn_struggle_target').GetFullName]已经失去生命迹象。革命委员会随后发表声明，指出这一不幸结果与广大群众正常表达革命义愤之间不存在必然联系。"
 mgn_revolutionary_committee_events.3.a: "革命不是请客吃饭。"
 mgn_revolutionary_committee_events.4.t: "炮打最高负责人"
 mgn_revolutionary_committee_events.4.d: "写有[SCOPE.sCharacter('mgn_struggle_target').GetFullName]名字的大字报已经贴满首都。支持者称这是继续革命的伟大实践，反对者则指出，如果国家最高负责人也能被群众随时打倒，那么批准群众打倒最高负责人的负责人又是谁？"
 mgn_revolutionary_committee_events.4.a: "不要被职务吓倒。"

 MGN_Southern_Garrison: "南都驻防军"
 MGN_Nile_Garrison: "尼罗驻防军"
 MGN_Western_Garrison: "西非驻防军"
 MGN_Eastern_Garrison: "东非驻防军"
 MGN_Southern_Sea_Fleet: "南洋水师"
