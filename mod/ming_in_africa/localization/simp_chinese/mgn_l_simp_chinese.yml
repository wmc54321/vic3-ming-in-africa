 button_mgn_move_capital_beijing: "迁都北京"
 button_mgn_move_capital_beijing_desc: "将首都与市场首都迁往北京，让朝廷重新坐回北方旧都与传统中原轴心。"
 button_mgn_move_capital_nanjing: "迁都南京"
 button_mgn_move_capital_nanjing_desc: "将首都与市场首都迁往南京，以江南旧都统合海内文书与海外记忆。"
 button_mgn_move_capital_yingtian: "迁都应天府"
 button_mgn_move_capital_yingtian_desc: "将首都与市场首都迁往北非埃及的应天府，宣告尼罗河畔也可以成为天下中枢。"
 button_mgn_establish_african_company_ming: "设立非洲特许公司"
 button_mgn_establish_african_company_ming_desc: "当朝廷离开非洲，又仍控制当地领土时，可把旧日海外根基交给非洲榷务公司经营。公司承接天朝万民和盘剥经济制度，大明本体则收束为更纯粹的汉家正统。"
 button_mgn_establish_african_company_qing: "设立非洲特许公司"
 button_mgn_establish_african_company_qing_desc: "当大清仍控制非洲旧土，却不愿把它们直接编为寻常行省时，可设立非洲榷务公司代行征收、经营与镇抚。"
 button_mgn_establish_mainland_company: "设立内地经略公司"
 button_mgn_establish_mainland_company_desc: "设立内地经略公司，代朝廷经理旧疆的钱粮、矿务、关防与驿路。它以汉家官商为骨架，用账册把内地重新缝合。"
 button_mgn_establish_korean_company: "设立东藩榷务公司"
 button_mgn_establish_korean_company_desc: "设立东藩榷务公司，接管朝鲜诸道的税务、港务和藩务整饬。旧日礼仪仍在，新来的却是会计、关吏与公司章程。"
 button_mgn_establish_lanfang_company: "设立兰芳榷务公司"
 button_mgn_establish_lanfang_company_desc: "设立兰芳榷务公司，把婆罗洲港口、锡矿和会馆商路纳入天朝牌照之下。旧公议传统会被保留，也会被账簿驯服。"
 button_mgn_establish_siberian_company: "设立西伯利亚特许公司"
 button_mgn_establish_siberian_company_desc: "设立西伯利亚榷务公司，以驿路、矿山、皮货和屯垦经营北境雪原。公司范围包括图瓦、外东北与库页岛。"
 button_mgn_restore_northeastern_border: "恢复东北边界"
 button_mgn_restore_northeastern_border_desc: "旧日东北疆界散落在藩属治下。朝廷可重定版籍：若内地经略公司仍在，便令其接管边务；否则收归中央。"
 button_mgn_restore_northwestern_border: "恢复西北边界"
 button_mgn_restore_northwestern_border_desc: "西北诸地久由藩属分治。朝廷可依旧疆重订版籍，连同吉尔吉斯州中原属大清的一隅一并整理。"
 mgn_restore_northeastern_border_effect_tt: "整顿东北版籍：外满洲与阿穆尔旧疆由内地经略公司接管；公司未设时，则归朝廷直辖。"
 mgn_restore_northwestern_border_effect_tt: "整顿西北版籍：旧疆由内地经略公司接管；公司未设时，则归朝廷直辖。吉尔吉斯州仍依1836年的旧界划分。"
 button_mgn_establish_central_asian_company: "设立中亚特许公司"
 button_mgn_establish_central_asian_company_desc: "设立中亚榷务公司，以绿洲、驼道、矿山和水渠经营西域旧路。公司奉儒家礼制，也懂得按账册说话。"
 mgn_has_african_company_land_tt: "本国、非公司附庸或其下级附庸控制任意非洲领土"
 mgn_has_mainland_company_land_tt: "本国、非公司附庸或其下级附庸控制任意内地、吉尔吉斯、伊犁、图瓦、西藏、库页岛或琉球领土"
