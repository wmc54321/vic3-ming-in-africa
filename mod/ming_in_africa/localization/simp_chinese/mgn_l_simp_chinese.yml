 mgn_heavenly_court_in_africa: "天朝在非洲"
 mgn_heavenly_court_in_africa_desc: "这个海外朝廷统治着辽阔而多样的非洲疆域。制度、交通与地方秩序都需要时间磨合。"
 mgn_southern_court_administration: "南都行台"
 mgn_southern_court_administration_desc: "大明在非洲设立临时行台、军府、黄册户籍和士绅承包行政体系，强行支撑跨大陆统治；随着制度常态化和地方利益固化，这种临时效率会逐渐消退。"

 law_mgn_heavenly_subjecthood: "天朝万民"
 law_mgn_heavenly_subjecthood_desc: "皇帝以天朝名分统合诸民，承认四方臣民的身份与有限仕进资格，同时通过礼法、学校和地方行政治理推动同化。"
 law_mgn_huayi_unity: "华夷一统"
 law_mgn_huayi_unity_desc: "国家将“天下一家”的帝国口号转化为跨族群共同体，承认多族群臣民的公共身份，同时继续推动礼法、教育与行政同化。"
 ideology_mgn_tianxia_order: "天下秩序"
 ideology_mgn_tianxia_order_desc: "该集团相信大明的正统不只来自血缘，也来自能否把四方诸民纳入天朝秩序。"
 ideology_mgn_overseas_reform: "海外维新"
 ideology_mgn_overseas_reform_desc: "该集团认为海外大明必须用更包容、更务实的制度来维持跨洲国家。"
 ideology_mgn_maritime_opening: "市舶开明"
 ideology_mgn_maritime_opening_desc: "该集团支持为贸易、航运和移民网络打开身份壁垒。"

 building_mgn_forbidden_city: "南都紫禁城"
 building_mgn_forbidden_city_desc: "仿照北京紫禁城营造的海外宫阙，象征大明天命在非洲重建。"
