l_simp_chinese:
 MGN: "大明"
 MGN_ADJ: "大明"
 MGN_FLAVOR_TEXT: "昔日神州易鼎之际，大明遗臣与宗室远航西去，最终在尼罗河畔重建朝廷。数百年间，汉人移民与非洲万民共同撑起了一个横跨大陆的天朝；然而驿路漫长、旧制难行，海东的大清也从未承认这份天命。如今工业与列强叩击国门，大明必须决定：是把非洲经营成新的中原，还是渡海东归，与另一个中华重定天下？"
