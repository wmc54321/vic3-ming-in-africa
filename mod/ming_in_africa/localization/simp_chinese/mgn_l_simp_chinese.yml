 dp_mgn_two_chinas_independence: "两中华独立战争"

 mgn_chinese_subjugation: "中华臣服"
 mgn_chinese_subjugation_desc: "迫使目标中华国家承认本朝为更高正统，并居于臣属地位。"
 mgn_brotherly_vassalization: "兄弟皇谊"
 mgn_brotherly_vassalization_desc: "以兄弟皇谊之名，迫使目标中华国家成为朝贡国或附庸国。"
 war_goal_mgn_brotherly_vassalization_type_name: "兄弟皇谊"
 war_goal_mgn_brotherly_vassalization: "兄弟皇谊"
 war_goal_mgn_brotherly_vassalization_desc: "迫使目标中华国家成为朝贡国或附庸国。"
 mgn_open_chinese_migration: "要求弛禁迁徙"
 mgn_open_chinese_migration_desc: "迫使目标中华国家弛禁迁徙，让边境、户籍与商路重新流动。"
 mgn_regulate_chinese_migration: "要求厘定迁徙章程"
 mgn_regulate_chinese_migration_desc: "迫使目标中华国家厘定迁徙章程，以官府文书约束跨境流动。"
 mgn_close_chinese_migration: "要求闭关封境"
 mgn_close_chinese_migration_desc: "迫使目标中华国家闭关封境，把人口流动重新锁进国界与关防之内。"
 mgn_two_chinas_independence: "要求独立"
 mgn_two_chinas_independence_desc: "让臣服的中华国家摆脱另一个中华国家的宗主权，重新自行宣称天命。"

 je_mgn_two_chinas: "两个中华"
 je_mgn_two_chinas_reason: "非洲的大明与亚洲的大清都自称承继中华正统。它们可以暂且并立，也可以用宗藩名分、兵锋、移民章程或共和合流来决定谁有资格代表天下。"
 je_mgn_rebuild_state_ming: "重建国家"
 je_mgn_rebuild_state_ming_reason: "大明已重定海内。朝廷必须决定天命落在何处：回銮北京，定鼎南京，还是承认尼罗河畔的应天府就是新的中原。非洲旧土与亚洲旧疆也要被重新编入一套国家秩序。"
 je_mgn_rebuild_state_qing: "重建国家"
 je_mgn_rebuild_state_qing_reason: "大清已压服海外明廷，但非洲不会因为一道捷报就变成寻常行省。朝廷需要把这片旧土安置成可治理、可征收、也可被继承的边外秩序。"
 je_mgn_bitter_peace: "苦涩的和平"
 je_mgn_bitter_peace_reason: "朝廷仍称中华正统，国书上却已有了宗主的名分。只要兵戈停息、外交博弈结束且停战期已过，忍下的和平仍可以被重新掀开。"

 button_mgn_launch_ming_reconquest: "发起反攻大陆"
 button_mgn_launch_ming_reconquest_desc: "大明若已压过大清，又没有战争或停战束缚，就可正式发起反攻。两国都将把统一中华写进战争目标，天下不会再容纳两个正统。"
 button_mgn_launch_qing_conquest: "发起武力统一"
 button_mgn_launch_qing_conquest_desc: "大清若已压过大明，又没有战争或停战束缚，就可出兵平定海外明廷。两国都将以统一中华为名开战。"
 button_mgn_claim_ming_reconquest_complete: "海内一统"
 button_mgn_claim_ming_reconquest_complete_desc: "亚洲大清已成旧事，大明可以开始重建统一后的国家秩序。"
 button_mgn_claim_qing_conquest_complete: "海内一统"
 button_mgn_claim_qing_conquest_complete_desc: "非洲明廷已被平定，大清可以开始安置海外旧土。"
 button_mgn_recognize_brotherly_hierarchy: "提议兄弟皇谊"
 button_mgn_recognize_brotherly_hierarchy_desc: "当两国仍保有君主、神权或社会君主原则时，强盛一方可以把优势写成宗藩礼法，要求对方以朝贡或附庸身份承认尊卑。"
 button_mgn_request_open_migration: "要求弛禁迁徙"
 button_mgn_request_open_migration_desc: "要求另一个中华废除迁徙禁令，让商民、劳工与亲族重新穿过关津。弱势朝廷若不愿照办，就只能让战场裁断边境章程。"
 button_mgn_request_regulated_migration: "要求厘定迁徙章程"
 button_mgn_request_regulated_migration_desc: "要求另一个中华采用迁徙章程，把人口流动纳入户籍、路引和官府文书。拒绝者等同拒绝承认本朝的制度号令。"
 button_mgn_request_closed_migration: "要求闭关封境"
 button_mgn_request_closed_migration_desc: "要求另一个中华闭关封境，阻断未经许可的越界迁徙。若对方坚持开边，争端将从户籍册转入战书。"
 button_mgn_launch_peaceful_unification: "提议和平统一"
 button_mgn_launch_peaceful_unification_desc: "在两国关系友善、政治制度相容且强弱已分时，向另一个中华提出合流。君主制、社会君主制与法团国家可以彼此合流；双方只需同为有选举或同为无选举，不必采用同一种制度。地产、财产、资格、普选和一党制都算有选举。其他政体则必须采用完全相同的治理原则。若对方已臣服，还需累计臣服满五年。"
 button_mgn_request_independence: "要求独立"
 button_mgn_request_independence_desc: "在兵戈、外交博弈与停战约束都暂时消退时，向宗主宣告本朝不再愿以臣属身份延续和平。"
 mgn_can_claim_ming_reconquest_complete_tt: "亚洲大清已不存在"
 mgn_can_claim_qing_conquest_complete_tt: "非洲大明已不存在，且大清仍是有效的中华中央政府"
 mgn_can_request_independence_from_other_china_tt: "臣服一方与宗主均未参战或卷入外交博弈，并且双方没有停战协议"
 mgn_tt_two_chinas_peace_tt: "双方均未参战，也未卷入外交博弈"
 mgn_tt_two_chinas_no_truce_tt: "双方没有停战协议"
 mgn_tt_higher_rank_than_other_china_tt: "本国国际地位高于另一个中华"
 mgn_tt_no_force_unification_in_progress_tt: "当前没有正在处理的统一战争要求"
 mgn_tt_ritual_monarchies_not_subjects_tt: "双方均保有君主、神权或社会君主原则，且互不臣属"
 mgn_tt_no_brotherly_hierarchy_in_progress_tt: "当前没有正在处理的兄弟皇谊要求"
