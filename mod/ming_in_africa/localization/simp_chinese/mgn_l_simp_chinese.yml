 ig_mgn_scholar_bureaucrats: "士绅官僚"
 ig_mgn_scholar_bureaucrats_desc: "凭借田产、科名与官府人脉维持地位的士绅。他们把地方秩序、礼法传统和朝廷权威视为彼此相连。"
 ig_mgn_confucian_scholars: "儒学士"
 ig_mgn_confucian_scholars_desc: "讲学、主持礼仪并为朝廷阐释经义的儒者。他们相信政治应以教化、名分和道德秩序为根本。"
 ig_mgn_divine_engine_camp: "神机营"
 ig_mgn_divine_engine_camp_desc: "由职业军官、军户后裔与军工人员组成的武职集团。他们以保卫海外朝廷、整饬军备和恢复国威为己任。"
 ig_mgn_overseas_literati: "海外文人"
 ig_mgn_overseas_literati_desc: "成长于跨洲帝国的学者、作家、教师与新式官僚。他们希望以教育、公共讨论和制度改革重新解释大明的天下秩序。"
 ig_mgn_guild_merchants: "会馆商民"
 ig_mgn_guild_merchants_desc: "依托会馆、行帮、街市和地方互助网络的小业主与市民。他们看重安稳生计、地方自治和有规矩的商业秩序。"
 ig_mgn_maritime_merchants: "市舶商帮"
 ig_mgn_maritime_merchants_desc: "经营远洋航运、工场、金融与跨洲贸易的商人和投资者。他们主张扩建港口、引进技术，并让资本在帝国各地畅通流动。"
 ig_mgn_lijia_peasantry: "里甲乡民"
 ig_mgn_lijia_peasantry_desc: "在里甲、村社与牧地中生活的农民和乡民。他们关心土地、赋役与地方生计，也警惕朝廷和市场对乡村索取过度。"
 ig_mgn_artisan_guilds: "工匠行会"
 ig_mgn_artisan_guilds_desc: "在作坊、矿场、码头与近代工厂中谋生的工匠和劳动者。他们依靠行会与结社争取稳定工作、公平报酬和共同保障。"

 ig_trait_mgn_gentry_relief: "乡绅赈济"
 ig_trait_mgn_gentry_relief_desc: "地方有灾有难，士绅理当开仓施粥、修桥铺路。这既是经世济民，也是维持乡里秩序与名望的本分。"
 ig_trait_mgn_patronage_networks: "门生故旧"
 ig_trait_mgn_patronage_networks_desc: "同年、同乡、师生与姻亲织成了跨越州县的关系网。一封私函有时比一纸公文更快抵达该去的地方。"
 ig_trait_mgn_register_privileges: "把持版籍"
 ig_trait_mgn_register_privileges_desc: "田亩、户籍与赋役册都要经过地方之手。若朝廷不肯顾全士绅体面，乡里的账目自然会变得难以查清。"
 ig_trait_mgn_guild_mutual_credit: "会馆互助"
 ig_trait_mgn_guild_mutual_credit_desc: "商民以同乡、同行与会馆作保，把分散的积蓄汇成可靠信用。朝廷若守约，这套网络也愿意替国用周转。"
 ig_trait_mgn_market_ward_networks: "街市网络"
 ig_trait_mgn_market_ward_networks_desc: "街坊、铺户与行会熟悉每一笔货账和每一条规矩。他们愿意合作时，官府也能借这些地方网络把事务办得井井有条。"
 ig_trait_mgn_guild_barriers: "行帮壁垒"
 ig_trait_mgn_guild_barriers_desc: "不满的会馆以旧章、行规与地方关系阻挡政令。文书仍在流转，真正办事的人却总能找到拖延和推诿的办法。"

 mgn_heavenly_court_in_africa: "天朝在非洲"
 mgn_heavenly_court_in_africa_desc: "大明的诏令能抵达非洲各地，却未必能立刻变成道路、税册和乡约。辽阔疆域仍在学习如何听命于同一座朝廷。"
 mgn_southern_court_administration: "南都行台"
 mgn_southern_court_administration_desc: "行台、军府、黄册和士绅包办让朝廷暂时撑住了跨洲统治。等临时差役变成常例，地方利益也会慢慢把这股效率磨平。"
 mgn_brotherly_hierarchy_recognized: "兄弟皇谊"
 mgn_brotherly_hierarchy_recognized_desc: "两个中华以宗藩名分暂定尊卑。胜负被写成礼法，臣服被称作兄弟，至少在国书上如此。"
 mgn_chinese_unification_integration_drive: "海内整合"
 mgn_chinese_unification_integration_drive_desc: "海内重新合于一统，朝廷把官吏、文书和地方钱粮集中起来，趁天下尚知变局未定，尽快把新领土纳入常制。"

 law_mgn_heavenly_subjecthood: "天朝万民"
 law_mgn_heavenly_subjecthood_desc: "皇帝以天朝名分统合诸民。四方百姓可以入籍、服役、读书和仕进，却仍被安置在清楚的等级与礼法之中。"
 law_mgn_huayi_unity: "华夷一统"
 law_mgn_huayi_unity_desc: "朝廷把“天下一家”从皇帝的德目改造成国家的制度承诺。不同族群共享同一公共身份，也在学校、礼法和行政里被慢慢织进同一套秩序。"
 law_mgn_overseas_cooperative_ownership: "人民资本合作制"
 law_mgn_overseas_cooperative_ownership_desc: "国家以人民合作之名重组海内产业，使国内工厂归劳动者共同所有；海外投资则仍借私人资本周转，让外洋贸易保留必要的弹性。"
 law_mgn_overseas_cooperative_ownership_foreign_tt: "本国国内产业按合作社所有制集体化；海外投资不会获得合作社所有制的海外集体化许可。"
 ideology_mgn_tianxia_order: "天下秩序"
 ideology_mgn_tianxia_order_desc: "该集团相信大明的正统不只来自血缘，也来自能否把四方诸民纳入天朝秩序。"
 ideology_mgn_overseas_reform: "海外维新"
 ideology_mgn_overseas_reform_desc: "该集团认为海外大明必须用更包容、更务实的制度来维持跨洲国家。"
 ideology_mgn_maritime_opening: "市舶开明"
 ideology_mgn_maritime_opening_desc: "该集团支持为贸易、航运和移民网络打开身份壁垒。"

 building_mgn_forbidden_city: "应天府紫禁城"
 building_mgn_forbidden_city_desc: "尼罗河畔的新宫城仿北京旧制而建。它告诉臣民，非洲不再只是播迁之地，而是朝廷重新丈量天下的中枢。"
 building_mgn_nanjing_forbidden_city: "南京紫禁城"
 building_mgn_nanjing_forbidden_city_desc: "江南旧都重起宫城，洪武旧制与海外朝廷的记忆在此合流。南京再次成为文书、礼仪与天命归心之所。"
 building_mgn_imperial_academy: "四海国子监"
 building_mgn_imperial_academy_desc: "播迁两百年后，朝廷已不能只靠几家旧臣与世袭书吏治理四方。四海国子监以经义定其本，以律令、算学、测绘与诸方语言通其实；各州生员汇于尼罗河畔，学成后再被遣往港口、矿场、工坊与府县。满编时，四方遣教略增全国教育机会，应天经世则重点培养下埃及的农民与专业人才。"
 pmg_base_building_mgn_imperial_academy: "应天学制（下埃及）"
 pm_mgn_imperial_academy: "应天经世（下埃及）"
