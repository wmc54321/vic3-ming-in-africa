 mgn_route_events.10.t: "All Under One Realm"
 mgn_route_events.10.d: "Qing no longer exists, and Ming is the only state left able to claim Chinese legitimacy."
 mgn_route_events.10.f: "The court once dismissed as overseas now writes its edicts back into the realm. Victory does not restore the old order by itself; palaces, registers, borders, and titles must all be arranged again."
 mgn_route_events.10.a: "Give the realm its order."
 mgn_route_events.20.t: "Unity by Force"
 mgn_route_events.20.d: "Qing has subdued the African Ming, ending the overseas claimant's independence."
 mgn_route_events.20.f: "The old challenger across the Indian Ocean is now inside the map of empire. Africa, however, cannot become ordinary provinces by proclamation alone; the court must decide how it will inherit, tax, and rule."
 mgn_route_events.20.a: "Settle the overseas realm."
 mgn_route_events.30.t: "Capital in Beijing"
 mgn_route_events.30.d: "Ming has moved its capital back to Beijing."
 mgn_route_events.30.f: "Palaces, ministries, and archives return to the old northern capital. Beijing turns the overseas centuries into a long exile finally brought to an end."
 mgn_route_events.30.a: "So it is settled."
 mgn_route_events.31.t: "Capital in Nanjing"
 mgn_route_events.31.d: "Ming has moved its capital to Nanjing."
 mgn_route_events.31.f: "The old southern capital once again anchors the dynasty, binding northern claims, overseas memory, river grain, and sea lanes into one court."
 mgn_route_events.31.a: "So it is settled."
 mgn_route_events.32.t: "Capital in Yingtian"
 mgn_route_events.32.d: "Ming has fixed its capital at Yingtian in Lower Egypt."
 mgn_route_events.32.f: "The court does not surrender Africa to exile or memory. The Nile, the Red Sea routes, Saharan posts, and new palace walls are written into the royal domain. China proper now stands not only between Yellow River and Yangtze, but also at the gates of Yingtian."
 mgn_route_events.32.a: "This too is the center."
 mgn_route_events.40.t: "African Revenue Company"
 mgn_route_events.40.d: "Ming has placed the old African realm under the African Revenue Company."
 mgn_route_events.40.f: "The registers, tax rolls, and local networks of the old field administration remain, but now they bear a company seal. Ming's first refuge is preserved, and repriced under a harsher charter."
 mgn_route_events.40.a: "Issue the charter."
 mgn_route_events.50.t: "African Revenue Company"
 mgn_route_events.50.d: "Qing has placed the former African realm under the African Revenue Company."
 mgn_route_events.50.f: "Even after unification, Africa remains distant across sea routes, deserts, and unfamiliar local orders. A company government will administer, collect, and extract on the court's behalf."
 mgn_route_events.50.a: "Issue the charter."
 mgn_route_events.140.t: "Interior Administration Company"
 mgn_route_events.140.d: "The court has entrusted selected interior territories to the Interior Administration Company."
 mgn_route_events.140.f: "Passes, granaries, mines, and customs houses are placed under a sharper company charter. It still speaks in the name of the Heavenly Court, but accounts and contracts now bind the old provinces."
 mgn_route_events.140.a: "Administer the interior by charter."
 mgn_route_events.141.t: "Eastern Tributary Revenue Company"
 mgn_route_events.141.d: "The court has entrusted the Korean circuits to the Eastern Tributary Revenue Company."
 mgn_route_events.141.f: "The Korean circuits will no longer be held by ritual alone. Company offices fold ports, tribute roads, and tax registers into a new imperial order."
 mgn_route_events.141.a: "Set the eastern marches in order."
 mgn_route_events.144.t: "Lanfang Revenue Company"
 mgn_route_events.144.d: "The court has entrusted Bornean holdings to the Lanfang Revenue Company."
 mgn_route_events.144.f: "Bornean ports, tin fields, and kongsi trade roads are placed under company management. Old merchant compacts are bound to a new imperial charter and written into a single ledger."
 mgn_route_events.144.a: "Administer the southern seas."
 mgn_route_events.142.t: "Siberian Revenue Company"
 mgn_route_events.142.d: "The court has entrusted northern territories to the Siberian Revenue Company."
 mgn_route_events.142.f: "Snowfield, taiga, and cold sea ports are bound into a frontier ledger. The company upholds Confucian rites through posts, mines, furs, and settlement."
 mgn_route_events.142.a: "Administer Siberia."
 mgn_route_events.143.t: "Central Asian Revenue Company"
 mgn_route_events.143.d: "The court has entrusted Central Asian territories to the Central Asian Revenue Company."
 mgn_route_events.143.f: "Oasis, steppe, and the old caravan roads are handed to company offices. Ledgers measure caravans, mines, and canals while court rites define the new frontier."
 mgn_route_events.143.a: "Administer Central Asia."
 mgn_route_events.60.t: "Brotherly Imperial Amity"
 mgn_route_events.60.d: "The two Chinas have recognized a ritual hierarchy."
 mgn_route_events.60.f: "The documents call it brotherly imperial amity. The reality of power is wrapped in ceremony, while defeat and submission are turned into a polite arrangement between kindred claims."
 mgn_route_events.60.a: "Observe the rites."
 mgn_route_events.100.t: "Peaceful Unification Proposal"
 mgn_route_events.100.d: "Ming proposes peaceful unification."
 mgn_route_events.100.f: "Their governments have converged, and old hostility has eased. The African court argues that China no longer needs two administrations, two armies, and two proclamations of legitimacy."
 mgn_route_events.100.a: "Accept unification."
 mgn_route_events.100.b: "Refuse and prepare for war."
 mgn_route_events.101.t: "Peaceful Unification Proposal"
 mgn_route_events.101.d: "Qing proposes peaceful unification."
 mgn_route_events.101.f: "Their governments have converged, and old hostility has dulled. Beijing argues that the overseas Ming court can enter a united state without another war."
 mgn_route_events.101.a: "Accept unification."
 mgn_route_events.101.b: "Refuse and prepare for war."
 mgn_route_events.110.t: "Brotherly Imperial Amity"
 mgn_route_events.110.d: "Ming asks Qing to accept tributary or vassal status as ritual hierarchy."
 mgn_route_events.110.f: "The envoy turns strength into ritual and submission into brotherly amity. Acceptance preserves the ancestral name; refusal leaves the matter to armies."
 mgn_route_events.110.a: "Accept imperial amity."
 mgn_route_events.110.b: "Refuse and prepare for war."
 mgn_route_events.111.t: "Brotherly Imperial Amity"
 mgn_route_events.111.d: "Qing asks Ming to accept tributary or vassal status as ritual hierarchy."
 mgn_route_events.111.f: "The envoy turns strength into ritual and submission into brotherly amity. Acceptance preserves the ancestral name; refusal leaves the matter to armies."
 mgn_route_events.111.a: "Accept imperial amity."
 mgn_route_events.111.b: "Refuse and prepare for war."
 mgn_route_events.120.t: "Border Migration Policy Demand"
 mgn_route_events.120.d: "Ming demands that Qing change its border migration policy."
 mgn_route_events.120.f: "The African court argues that the stronger claimant to Chinese legitimacy should set the laws governing movement across the frontier."
 mgn_route_events.120.a: "Adopt Ming migration policy."
 mgn_route_events.120.b: "Refuse and prepare for war."
 mgn_route_events.121.t: "Border Migration Policy Demand"
 mgn_route_events.121.d: "Qing demands that Ming change its border migration policy."
 mgn_route_events.121.f: "The Beijing court argues that the stronger claimant to Chinese legitimacy should set the laws governing movement across the frontier."
 mgn_route_events.121.a: "Adopt Qing migration policy."
 mgn_route_events.121.b: "Refuse and prepare for war."
 mgn_migration_policy_alignment_rejected: "Border Migration Policy Dispute"
 mgn_route_events.130.t: "A Bitter Peace"
 mgn_route_events.130.d: "This court now lives under the overlordship of the other Chinese state."
 mgn_route_events.130.f: "The documents still speak of brotherhood, but the hierarchy is written plainly enough. This peace may hold, yet it is not sweet."
 mgn_route_events.130.a: "Endure, and wait."
