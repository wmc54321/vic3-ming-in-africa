 ig_mgn_scholar_bureaucrats: "Scholar Bureaucrats"
 ig_mgn_scholar_bureaucrats_desc: "Gentry whose standing rests on estates, examination learning, and connections within the administration. They see local order, ritual tradition, and court authority as inseparable."
 ig_mgn_confucian_scholars: "Confucian Scholars"
 ig_mgn_confucian_scholars_desc: "Teachers, ritual specialists, and scholars who interpret the classics for the court. They believe politics should rest on moral cultivation, proper relationships, and an ordered society."
 ig_mgn_divine_engine_camp: "Divine Engine Camp"
 ig_mgn_divine_engine_camp_desc: "Professional officers, hereditary military families, and workers tied to the arsenals. They are committed to defending the overseas court, strengthening the armed forces, and restoring imperial prestige."
 ig_mgn_overseas_literati: "Overseas Literati"
 ig_mgn_overseas_literati_desc: "Scholars, writers, teachers, and modern officials shaped by a transcontinental empire. They seek to reinterpret Ming's tianxia order through education, public debate, and institutional reform."
 ig_mgn_guild_merchants: "Guild Merchants"
 ig_mgn_guild_merchants_desc: "Small proprietors and townspeople organized through guild halls, trades, markets, and mutual-aid networks. They value secure livelihoods, local autonomy, and commerce governed by familiar rules."
 ig_mgn_maritime_merchants: "Maritime Merchants"
 ig_mgn_maritime_merchants_desc: "Merchants and investors engaged in oceanic shipping, workshops, finance, and transcontinental trade. They favor larger ports, imported technology, and the free circulation of capital across the empire."
 ig_mgn_lijia_peasantry: "Lijia Peasantry"
 ig_mgn_lijia_peasantry_desc: "Farmers and rural people living within village compacts, lijia registers, and pastoral communities. They care about land, taxes, and local subsistence, and distrust excessive demands from court and market alike."
 ig_mgn_artisan_guilds: "Artisan Guilds"
 ig_mgn_artisan_guilds_desc: "Artisans and laborers working in workshops, mines, docks, and modern factories. Through guilds and associations they seek steady work, fair wages, and shared protection."

 ig_trait_mgn_gentry_relief: "Gentry Relief"
 ig_trait_mgn_gentry_relief_desc: "When hardship strikes, the local gentry are expected to open granaries, feed the poor, and repair roads and bridges. Public charity sustains both the community and their standing within it."
 ig_trait_mgn_patronage_networks: "Patronage Networks"
 ig_trait_mgn_patronage_networks_desc: "Classmates, countrymen, pupils, teachers, and in-laws form networks that cross provincial borders. A private letter can sometimes travel farther and faster than an official dispatch."
 ig_trait_mgn_register_privileges: "Command of the Registers"
 ig_trait_mgn_register_privileges_desc: "Land rolls, household registers, and service obligations all pass through local hands. If the court disregards gentry standing, the countryside's accounts become remarkably difficult to audit."
 ig_trait_mgn_guild_mutual_credit: "Guild Mutual Credit"
 ig_trait_mgn_guild_mutual_credit_desc: "Merchants pool scattered savings through native-place ties, trades, and guild halls. When the court honors its obligations, these networks are willing to finance the needs of the state."
 ig_trait_mgn_market_ward_networks: "Market Ward Networks"
 ig_trait_mgn_market_ward_networks_desc: "Shopkeepers, ward elders, and guilds know every account and local convention. With their cooperation, the administration can use these networks to keep public business in good order."
 ig_trait_mgn_guild_barriers: "Guild Barriers"
 ig_trait_mgn_guild_barriers_desc: "Discontented guild halls obstruct policy through old charters, trade rules, and local connections. Documents continue to circulate, while those responsible for acting on them discover endless reasons to delay."

 mgn_heavenly_court_in_africa: "The Heavenly Court in Africa"
 mgn_heavenly_court_in_africa_desc: "Ming edicts can reach every corner of Africa, but roads, tax registers, and village compacts take longer to obey. The realm is still learning how to answer to one court."
 mgn_southern_court_administration: "Southern Court Administration"
 mgn_southern_court_administration_desc: "Field administrations, military governorates, yellow registers, and gentry contractors hold transcontinental rule together for now. As emergency service becomes routine, local interests will wear down that efficiency."
 mgn_brotherly_hierarchy_recognized: "Brotherly Imperial Amity"
 mgn_brotherly_hierarchy_recognized_desc: "The two Chinas have fixed their hierarchy in tributary language. Victory is written as ritual, submission as brotherhood, at least in the official letters."
 mgn_chinese_unification_integration_drive: "Imperial Integration Drive"
 mgn_chinese_unification_integration_drive_desc: "With the realm reunited, the court gathers clerks, registers, and local revenues while everyone still remembers that the settlement is new."

 law_mgn_heavenly_subjecthood: "Heavenly Subjects"
 law_mgn_heavenly_subjecthood_desc: "The emperor gathers many peoples beneath the Heavenly Court. They may be registered, serve, study, and rise, but always within a visible order of rank and ritual."
 law_mgn_huayi_unity: "Sino-Barbarian Unity"
 law_mgn_huayi_unity_desc: "The court turns All Under Heaven from an imperial virtue into a state promise. Different peoples share a public identity, while schools, rites, and administration slowly bind them into one order."
 law_mgn_overseas_cooperative_ownership: "People's Capital Cooperation"
 law_mgn_overseas_cooperative_ownership_desc: "The state reorganizes home industry in the name of popular cooperation, giving domestic workplaces to their workers while overseas investments keep the flexibility of private finance."
 law_mgn_overseas_cooperative_ownership_foreign_tt: "Domestic industries collectivize as under Cooperative Ownership; foreign investments do not receive Cooperative Ownership's foreign collectivization permission."
 ideology_mgn_tianxia_order: "Tianxia Order"
 ideology_mgn_tianxia_order_desc: "This group believes Ming legitimacy rests not only on lineage, but on its ability to bring many peoples into the order of All Under Heaven."
 ideology_mgn_overseas_reform: "Overseas Reform"
 ideology_mgn_overseas_reform_desc: "This group believes the overseas Ming must use more inclusive and pragmatic institutions to preserve a transcontinental state."
 ideology_mgn_maritime_opening: "Maritime Opening"
 ideology_mgn_maritime_opening_desc: "This group supports loosening barriers of status for trade, shipping, and migration networks."

 building_mgn_forbidden_city: "Yingtian Forbidden City"
 building_mgn_forbidden_city_desc: "A new palace city on the Nile, modeled after Beijing. It declares that Africa is no longer a place of exile, but the center from which Ming measures the world again."
 building_mgn_nanjing_forbidden_city: "Nanjing Forbidden City"
 building_mgn_nanjing_forbidden_city_desc: "A restored palace city in the old southern capital, where Hongwu precedent and the memory of the overseas court meet in one set of gates, archives, and rites."
 building_mgn_imperial_academy: "Imperial Academy of the Four Seas"
 building_mgn_imperial_academy_desc: "After two centuries in exile, the court can no longer govern the four quarters through a few old families and hereditary clerks. The Academy grounds its students in the classics, then trains them in law, mathematics, surveying, and the languages of the realm before dispatching them to ports, mines, workshops, and prefectures. At full employment, Dispatches to the Four Quarters slightly improve education access nationwide, while Yingtian Statecraft concentrates on peasants and professional talent in Lower Egypt."
 pmg_base_building_mgn_imperial_academy: "Yingtian Curriculum (Lower Egypt)"
 pm_mgn_imperial_academy: "Yingtian Statecraft (Lower Egypt)"
 pmg_mgn_imperial_academy_outreach: "Four Quarters Dispatches (Nationwide)"
 pm_mgn_imperial_academy_outreach: "Four Quarters Dispatches (Nationwide)"
 building_beijing_imperial_academy: "Metropolitan Guozijian"
 building_beijing_imperial_academy_desc: "The Metropolitan Guozijian carries forward the academies of successive dynasties, gathering tribute students and instructors to study the classics, law, mathematics, geography, and the languages of the realm. With restored halls and an expanded curriculum, Beijing's old academy can continue training officials for whoever rules the realm, even when the imperial residence moves elsewhere. At full employment, Provincial Education Directives slightly improve education access nationwide, while Metropolitan Statecraft concentrates on peasants and professional talent in Beijing."
 pmg_base_building_beijing_imperial_academy: "Metropolitan Curriculum (Beijing)"
 pm_beijing_imperial_academy: "Metropolitan Statecraft (Beijing)"
 pmg_beijing_imperial_academy_outreach: "Provincial Education Directives (Nationwide)"
 pm_beijing_imperial_academy_outreach: "Provincial Education Directives (Nationwide)"
 building_guangzhou_thirteen_factories: "Guangzhou Thirteen Factories"
 building_guangzhou_thirteen_factories_desc: "The factories, warehouses, and merchant guildhalls along the Pearl River bind the Canton Customs, licensed hong merchants, and ocean-going shipowners into a disciplined commercial order. Goods are appraised, insured, financed, and transshipped here, while foreign merchants reach the Chinese market through authorized intermediaries. At full employment, Canton Trade strengthens trade capacity and advantage in Guangdong, while the Thirteen Factories Network slightly increases influence nationwide."
 pmg_base_building_guangzhou_thirteen_factories: "Thirteen Factories System (Guangdong)"
 pm_guangzhou_thirteen_factories: "Canton Trade (Guangdong)"
 pmg_guangzhou_thirteen_factories_network: "Thirteen Factories Network (Nationwide)"
 pm_guangzhou_thirteen_factories_network: "Thirteen Factories Network (Nationwide)"
 building_jinghai_maritime_exchange: "Jinghai Maritime Exchange"
 building_jinghai_maritime_exchange_desc: "The Ming maritime-trade office has merged at the Nile mouth with nineteenth-century merchant houses, bills of exchange, insurance, and warehousing. Jinghai's licensed merchants guarantee, interpret, and arrange passage for goods from Africa, Europe, and Asia, giving the overseas court a true gateway to the Four Seas. At full employment, Jinghai Exchange strengthens trade capacity and advantage in Lower Egypt, while the Four Seas Network slightly increases influence nationwide."
