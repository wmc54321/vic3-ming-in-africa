 mgn_heavenly_court_in_africa: "The Heavenly Court in Africa"
 mgn_heavenly_court_in_africa_desc: "This overseas court rules a vast and diverse African realm. Its institutions, communications, and local order need time to settle."
 mgn_southern_court_administration: "Southern Court Administration"
 mgn_southern_court_administration_desc: "The Great Ming relies on provisional field administrations, military governorates, yellow-register surveys, and gentry contractors to sustain rule across Africa. This emergency efficiency will fade as local institutions settle."

 law_mgn_heavenly_subjecthood: "Heavenly Subjects"
 law_mgn_heavenly_subjecthood_desc: "The emperor integrates many peoples under the Heavenly Court, recognizing their status and limited paths into office while promoting assimilation through rites, schooling, and local administration."
 law_mgn_huayi_unity: "Sino-Barbarian Unity"
 law_mgn_huayi_unity_desc: "The state turns the imperial slogan of All Under Heaven into a transethnic political community, recognizing a shared public identity while continuing assimilation through rites, education, and administration."
 ideology_mgn_tianxia_order: "Tianxia Order"
 ideology_mgn_tianxia_order_desc: "This group believes Ming legitimacy rests not only on lineage, but on its ability to bring many peoples into the order of All Under Heaven."
 ideology_mgn_overseas_reform: "Overseas Reform"
 ideology_mgn_overseas_reform_desc: "This group believes the overseas Ming must use more inclusive and pragmatic institutions to preserve a transcontinental state."
 ideology_mgn_maritime_opening: "Maritime Opening"
 ideology_mgn_maritime_opening_desc: "This group supports loosening barriers of status for trade, shipping, and migration networks."

 building_mgn_forbidden_city: "Southern Forbidden City"
 building_mgn_forbidden_city_desc: "An overseas palace complex modeled on the Forbidden City in Beijing, symbolizing the restoration of Ming Heaven's Mandate in Africa."
