 MGN: "Great Ming"
 MGN_ADJ: "Ming"
 MGN_FLAVOR_TEXT: "When the old order fell in China, Ming loyalists and members of the imperial house sailed west and rebuilt their court upon the Nile. Over the centuries, Chinese settlers and the peoples of Africa have sustained a realm spanning the continent, yet distance strains its institutions and Qing has never accepted its claim to the Mandate. As industry and foreign powers press upon the world, will Ming make Africa a new heartland—or sail east to settle which China rules All Under Heaven?"
