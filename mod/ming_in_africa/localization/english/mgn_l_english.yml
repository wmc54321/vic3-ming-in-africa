 dp_mgn_chinese_subjugation_tooltip: "#header $dp_mgn_chinese_subjugation$#!\n$TOOLTIP_DELIMITER$\nStart a diplomatic play to make another Chinese state a tributary or vassal."
 dp_mgn_open_chinese_migration: "Demand Free Migration"
 dp_mgn_open_chinese_migration_tooltip: "#header $dp_mgn_open_chinese_migration$#!\n$TOOLTIP_DELIMITER$\nStart a diplomatic play to force another Chinese country to abolish migration controls."
 dp_mgn_regulate_chinese_migration: "Demand Migration Statutes"
 dp_mgn_regulate_chinese_migration_tooltip: "#header $dp_mgn_regulate_chinese_migration$#!\n$TOOLTIP_DELIMITER$\nStart a diplomatic play to force another Chinese country to adopt migration controls."
 dp_mgn_close_chinese_migration: "Demand Closed Borders"
 dp_mgn_close_chinese_migration_tooltip: "#header $dp_mgn_close_chinese_migration$#!\n$TOOLTIP_DELIMITER$\nStart a diplomatic play to force another Chinese country to close its borders."
 dp_mgn_two_chinas_open_migration: "Two Chinas Free Migration Dispute"
 dp_mgn_two_chinas_regulated_migration: "Two Chinas Migration Statutes Dispute"
 dp_mgn_two_chinas_closed_migration: "Two Chinas Closed Borders Dispute"
 dp_mgn_two_chinas_independence: "Two Chinas Independence War"
 mgn_chinese_subjugation: "Chinese Submission"
 mgn_chinese_subjugation_desc: "Force the target Chinese state to recognize this court as the higher claimant and accept subject status."
 mgn_brotherly_vassalization: "Brotherly Imperial Amity"
 mgn_brotherly_vassalization_desc: "In the name of brotherly imperial amity, force the target Chinese state to become a tributary or vassal."
 war_goal_mgn_brotherly_vassalization_type_name: "Brotherly Imperial Amity"
 war_goal_mgn_brotherly_vassalization: "Brotherly Imperial Amity"
 war_goal_mgn_brotherly_vassalization_desc: "Force the target Chinese state to become a tributary or vassal."
 mgn_open_chinese_migration: "Demand Free Migration"
 mgn_open_chinese_migration_desc: "Force the target Chinese state to abolish migration controls and reopen the movement of merchants, workers, and families."
 mgn_regulate_chinese_migration: "Demand Migration Statutes"
 mgn_regulate_chinese_migration_desc: "Force the target Chinese state to regulate movement through household registers, passes, and official statutes."
 mgn_close_chinese_migration: "Demand Closed Borders"
 mgn_close_chinese_migration_desc: "Force the target Chinese state to close its borders and return migration to frontier posts and state permission."
 mgn_two_chinas_independence: "Demand Independence"
 mgn_two_chinas_independence_desc: "Free a subject Chinese claimant from the other claimant's overlordship, allowing it to claim Heaven's Mandate in its own name again."

 je_mgn_two_chinas: "Two Chinas"
 je_mgn_two_chinas_reason: "The African Ming and the Asian Qing both claim Chinese legitimacy. They may coexist for now, or settle the question through tributary rank, war, migration statutes, or a peaceful merger after political convergence."
 je_mgn_rebuild_state_ming: "Rebuild the State"
 je_mgn_rebuild_state_ming_reason: "Ming has reunited the realm. The court must decide where the mandate now rests: Beijing, Nanjing, or Yingtian on the Nile as a new China proper. The old African realm and the recovered Asian provinces must be written into one state order."
 je_mgn_rebuild_state_qing: "Rebuild the State"
 je_mgn_rebuild_state_qing_reason: "Qing has defeated the overseas Ming court, but Africa will not become ordinary provinces because a victory notice says so. The court needs an order that can govern, collect, and inherit those distant lands."
 je_mgn_bitter_peace: "A Bitter Peace"
 je_mgn_bitter_peace_reason: "The court still claims Chinese legitimacy, yet its documents now carry another claimant's overlordship. Once war, diplomatic plays, and truce obligations fall away, this bitter peace can be challenged."

 button_mgn_launch_ming_reconquest: "Launch Mainland Reconquest"
 button_mgn_launch_ming_reconquest_desc: "If Ming has overtaken Qing and neither side is bound by war or truce, begin the reconquest. Both states will write Chinese unification into their war aims."
 button_mgn_launch_qing_conquest: "Launch Armed Unification"
 button_mgn_launch_qing_conquest_desc: "If Qing has overtaken Ming and neither side is bound by war or truce, move to settle the overseas court by force. Both states will fight in the name of Chinese unification."
 button_mgn_claim_ming_reconquest_complete: "All Under One Realm"
 button_mgn_claim_ming_reconquest_complete_desc: "Qing has passed into history; Ming can begin rebuilding the state order after unification."
 button_mgn_claim_qing_conquest_complete: "All Under One Realm"
 button_mgn_claim_qing_conquest_complete_desc: "The African Ming court has been subdued; Qing can begin settling the former overseas realm."
 button_mgn_recognize_brotherly_hierarchy: "Propose Imperial Amity"
 button_mgn_recognize_brotherly_hierarchy_desc: "When both courts still preserve monarchical, theocratic, or social-monarchic principles, the stronger claimant may turn advantage into ritual hierarchy and demand tributary or vassal status."
 button_mgn_request_open_migration: "Demand Free Migration"
 button_mgn_request_open_migration_desc: "Demand that the other China abolish migration controls, reopening passes, markets, and family routes. If the weaker court refuses, the statutes will be settled by war."
 button_mgn_request_regulated_migration: "Demand Migration Statutes"
 button_mgn_request_regulated_migration_desc: "Demand that the other China regulate migration through registers, passes, and official statutes. Refusal is a rejection of this court's authority to set the frontier order."
 button_mgn_request_closed_migration: "Demand Closed Borders"
 button_mgn_request_closed_migration_desc: "Demand that the other China close its borders and stop unauthorized movement. If the frontier stays open, the dispute moves from registers to war declarations."
 button_mgn_launch_peaceful_unification: "Propose Peaceful Unification"
 button_mgn_launch_peaceful_unification_desc: "Propose merger when relations are amicable, the political systems are compatible, and rank has settled the stronger claimant. Monarchies, social monarchies, and corporate states may merge with one another as long as both are electoral or both non-electoral; their exact laws need not match. Landed, wealth, census, universal, and single-party voting all count as electoral. Other governments must have the exact same governance principle. A subject China must first serve for five cumulative years."
 button_mgn_request_independence: "Demand Independence"
 button_mgn_request_independence_desc: "When war, diplomatic plays, and truce obligations have faded, declare that this court will no longer keep peace as another China's subject."
 mgn_can_claim_ming_reconquest_complete_tt: "Asian Qing no longer exists"
 mgn_can_claim_qing_conquest_complete_tt: "African Ming no longer exists, and Qing remains the valid Chinese central government"
 mgn_can_request_independence_from_other_china_tt: "The subject and overlord are both at peace and outside diplomatic plays, and neither side has a truce with the other"
 mgn_tt_two_chinas_peace_tt: "Both states are at peace and outside diplomatic plays"
 mgn_tt_two_chinas_no_truce_tt: "Neither side has a truce with the other"
 mgn_tt_higher_rank_than_other_china_tt: "This country has a higher rank than the other China"
 mgn_tt_no_force_unification_in_progress_tt: "No unification war demand is already being processed"
 mgn_tt_ritual_monarchies_not_subjects_tt: "Both states retain monarchical, theocratic, or social-monarchic principles, and neither is subject to the other"
 mgn_tt_no_brotherly_hierarchy_in_progress_tt: "No imperial amity demand is already being processed"
 mgn_tt_amicable_and_unifiable_government_tt: "Relations are amicable; monarchies, social monarchies, and corporate states may merge with one another, but both must be electoral or both non-electoral (landed, wealth, census, universal, and single-party voting count as electoral); other governments need the exact same governance principle"
 mgn_tt_rank_or_five_year_subject_union_tt: "This country has the higher rank; if the other China is a subject, it must have served for five cumulative years"
 mgn_tt_no_peaceful_unification_in_progress_tt: "No peaceful unification proposal is already being processed"
 mgn_tt_rank_or_overlord_for_migration_tt: "This country either outranks or overlords the other China"
 mgn_tt_migration_policy_differs_tt: "The two countries have different migration laws"
 mgn_tt_no_migration_policy_alignment_in_progress_tt: "No migration policy demand is already being processed"
 mgn_chinese_chartered_company_cannot_form_china_tt: "#bold Chinese chartered companies#! cannot form China"
 button_mgn_move_capital_beijing: "Move Capital to Beijing"
 button_mgn_move_capital_beijing_desc: "Move the capital and market capital to Beijing, returning the court to the old northern axis of Chinese rule."
 button_mgn_move_capital_nanjing: "Move Capital to Nanjing"
 button_mgn_move_capital_nanjing_desc: "Move the capital and market capital to Nanjing, where the old southern capital can bind home documents to overseas memory."
 button_mgn_move_capital_yingtian: "Move Capital to Yingtian"
 button_mgn_move_capital_yingtian_desc: "Move the capital and market capital to Yingtian in Lower Egypt, declaring that the Nile can also be the center of the realm."
 button_mgn_establish_african_company_ming: "Establish African Chartered Company"
 button_mgn_establish_african_company_ming_desc: "If the court has left Africa while still holding land there, entrust the old overseas base to the African Revenue Company. The company keeps Heavenly Subjects and an extractive economy, while Ming proper narrows its claim to Han orthodoxy."
 button_mgn_establish_african_company_qing: "Establish African Chartered Company"
 button_mgn_establish_african_company_qing_desc: "If Qing still controls African lands but does not wish to fold them into ordinary provinces, charter the African Revenue Company to collect, administer, and pacify them."
 button_mgn_establish_mainland_company: "Establish Interior Administration Company"
 button_mgn_establish_mainland_company_desc: "Create a Han administration company to manage revenues, mines, passes, and roads across the old interior, stitching the region together with accounts."
 button_mgn_establish_korean_company: "Establish Eastern Tributary Revenue Company"
 button_mgn_establish_korean_company_desc: "Create the Eastern Tributary Revenue Company to manage Korean taxes, ports, and tributary affairs. The old rites remain, now joined by ledgers and company statutes."
 button_mgn_establish_lanfang_company: "Establish Lanfang Revenue Company"
 button_mgn_establish_lanfang_company_desc: "Create the Lanfang Revenue Company to bring Bornean ports, tin fields, and kongsi trade roads under imperial charter."
 button_mgn_establish_siberian_company: "Establish Siberian Chartered Company"
 button_mgn_establish_siberian_company_desc: "Create the Siberian Revenue Company to manage the northern frontier, including Tuva, Outer Manchuria, and Sakhalin."
 button_mgn_restore_northeastern_border: "Restore the Northeastern Border"
 button_mgn_restore_northeastern_border_desc: "The old northeastern marches lie scattered among the tributaries. Reorder their registers under the Mainland Company, or under the court if no such company exists."
 button_mgn_restore_northwestern_border: "Restore the Northwestern Border"
 button_mgn_restore_northwestern_border_desc: "The northwestern marches have long been divided among tributaries. Restore the old registers, including Qing's former portion of Kirghizia."
 mgn_restore_northeastern_border_effect_tt: "Reorder the northeastern registers: Outer Manchuria and Amur pass to the Mainland Company, or to direct rule if it has not been established."
 mgn_restore_northwestern_border_effect_tt: "Reorder the northwestern registers under the Mainland Company, or under direct rule if it has not been established. Kirghizia retains its 1836 division."
 button_mgn_establish_central_asian_company: "Establish Central Asian Chartered Company"
 button_mgn_establish_central_asian_company_desc: "Create the Central Asian Revenue Company to administer oases, caravan roads, mines, and canals with both Confucian ritual and hard accounts."
 mgn_has_african_company_land_tt: "You, a non-company subject, or a lower subject controls any African territory"
 mgn_has_mainland_company_land_tt: "You, a non-company subject, or a lower subject controls any interior, Kirghiz, Ili, Tuvan, Tibetan, Sakhalin, or Ryukyuan territory"
 mgn_has_korean_company_land_tt: "You, a non-company subject, or a lower subject controls any Korean territory"
