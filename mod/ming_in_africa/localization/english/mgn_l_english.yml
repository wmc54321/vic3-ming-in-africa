 mgn_heavenly_court_in_africa: "The Heavenly Court in Africa"
 mgn_heavenly_court_in_africa_desc: "Ming edicts can reach every corner of Africa, but roads, tax registers, and village compacts take longer to obey. The realm is still learning how to answer to one court."
 mgn_southern_court_administration: "Southern Court Administration"
 mgn_southern_court_administration_desc: "Field administrations, military governorates, yellow registers, and gentry contractors hold transcontinental rule together for now. As emergency service becomes routine, local interests will wear down that efficiency."
 mgn_brotherly_hierarchy_recognized: "Brotherly Imperial Amity"
 mgn_brotherly_hierarchy_recognized_desc: "The two Chinas have fixed their hierarchy in tributary language. Victory is written as ritual, submission as brotherhood, at least in the official letters."
 mgn_chinese_unification_integration_drive: "Imperial Integration Drive"
 mgn_chinese_unification_integration_drive_desc: "With the realm reunited, the court gathers clerks, registers, and local revenues while everyone still remembers that the settlement is new."

 law_mgn_heavenly_subjecthood: "Heavenly Subjects"
 law_mgn_heavenly_subjecthood_desc: "The emperor gathers many peoples beneath the Heavenly Court. They may be registered, serve, study, and rise, but always within a visible order of rank and ritual."
 law_mgn_huayi_unity: "Sino-Barbarian Unity"
 law_mgn_huayi_unity_desc: "The court turns All Under Heaven from an imperial virtue into a state promise. Different peoples share a public identity, while schools, rites, and administration slowly bind them into one order."
 law_mgn_overseas_cooperative_ownership: "People's Capital Cooperation"
 law_mgn_overseas_cooperative_ownership_desc: "The state reorganizes home industry in the name of popular cooperation, giving domestic workplaces to their workers while overseas investments keep the flexibility of private finance."
 law_mgn_overseas_cooperative_ownership_foreign_tt: "Domestic industries collectivize as under Cooperative Ownership; foreign investments do not receive Cooperative Ownership's foreign collectivization permission."
 ideology_mgn_tianxia_order: "Tianxia Order"
 ideology_mgn_tianxia_order_desc: "This group believes Ming legitimacy rests not only on lineage, but on its ability to bring many peoples into the order of All Under Heaven."
 ideology_mgn_overseas_reform: "Overseas Reform"
 ideology_mgn_overseas_reform_desc: "This group believes the overseas Ming must use more inclusive and pragmatic institutions to preserve a transcontinental state."
 ideology_mgn_maritime_opening: "Maritime Opening"
 ideology_mgn_maritime_opening_desc: "This group supports loosening barriers of status for trade, shipping, and migration networks."

 building_mgn_forbidden_city: "Yingtian Forbidden City"
 building_mgn_forbidden_city_desc: "A new palace city on the Nile, modeled after Beijing. It declares that Africa is no longer a place of exile, but the center from which Ming measures the world again."
 building_mgn_nanjing_forbidden_city: "Nanjing Forbidden City"
 building_mgn_nanjing_forbidden_city_desc: "A restored palace city in the old southern capital, where Hongwu precedent and the memory of the overseas court meet in one set of gates, archives, and rites."
 HUB_NAME_STATE_LOWER_EGYPT_city_mgn: "Yingtian Prefecture"
 HUB_NAME_STATE_LOWER_EGYPT_port_mgn: "Jinghai Port"

