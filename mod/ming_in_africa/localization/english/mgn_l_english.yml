 mgn_open_chinese_migration_desc: "Force the other Chinese court to abolish migration controls and reopen the passes to merchants, workers, and families."
 mgn_regulate_chinese_migration: "Demand Migration Statutes"
 mgn_regulate_chinese_migration_desc: "Force the other Chinese court to regulate movement through household registers, travel passes, and frontier statutes."
 mgn_close_chinese_migration: "Demand Closed Borders"
 mgn_close_chinese_migration_desc: "Force the other Chinese court to close its borders and return migration to frontier posts and official permission."
 mgn_two_chinas_independence: "Demand Independence"
 mgn_two_chinas_independence_desc: "Free a subject Chinese claimant from the other claimant's overlordship, allowing it to claim Heaven's Mandate in its own name again."

 je_mgn_two_chinas: "Two Chinas"
 je_mgn_two_chinas_reason: "The African Ming and the Asian Qing both claim Chinese legitimacy. The two courts may coexist for now, or settle the question through tributary rank, war, migration statutes, or political union."
 je_mgn_two_chinas_lobby: "The Ming on the Nile and the Qing in China each claim an undivided Mandate. Choose either court and settle Chinese legitimacy through tributary hierarchy, migration, political union, or a war of unification."
 objective_mgn_two_chinas: "Two Chinas"
 objective_mgn_two_chinas_desc: "The Ming dynasty endures on the Nile while the Qing rule China in Asia. Choose either court and decide whether the two realms will coexist, submit, unite politically, or settle the Mandate by war."
 objective_mgn_two_chinas_idle_header: "Settle the Mandate"
 objective_mgn_two_chinas_idle_hint: "Continue the tributary, migration, union, or conquest routes in the Two Chinas Journal Entry"
 objective_mgn_two_chinas_name_MGN: "#v $MGN$#!"
 objective_mgn_two_chinas_desc_MGN: "#lore Rule from Yingtian on the Nile, cultivate a new African heartland, and choose whether to coexist with Qing, subordinate it, or return across the seas to reunify China.#!"
 objective_mgn_two_chinas_name_CHI: "#v $dyn_c_great_qing$#!"
 objective_mgn_two_chinas_desc_CHI: "#lore The Qing rule China proper but must answer the overseas Ming claim: bind the courts through hierarchy, pursue political union, or bring the African dynasty to heel.#!"
 je_mgn_rebuild_state_ming: "Rebuild the State"
 je_mgn_rebuild_state_ming_reason: "Ming has reunited the realm. The court must decide where the Mandate rests, establish its capital, and reorder the northeastern and northwestern registers."
 je_mgn_rebuild_state_qing: "Rebuild the State"
 je_mgn_rebuild_state_qing_reason: "Qing has defeated the overseas Ming court, but must still restore the central order of the reunited realm and settle the registers of its northeastern and northwestern frontiers."
 je_mgn_administer_four_quarters: "Administer the Four Quarters"
 je_mgn_administer_four_quarters_reason: "The ascendant court may organize territories it already controls but cannot readily govern from the center as subject companies rooted in local conditions and emerging Sinitic cultures. These companies manage revenue, commerce, and local integration under imperial charter."
 je_mgn_bitter_peace: "A Bitter Peace"
 je_mgn_bitter_peace_reason: "The court still claims Chinese legitimacy, yet its documents now carry another claimant's overlordship. Once war, diplomatic plays, and truce obligations fall away, this bitter peace can be challenged."

 button_mgn_launch_ming_reconquest: "Launch Mainland Reconquest"
 button_mgn_launch_ming_reconquest_desc: "If Ming has overtaken Qing and neither side is bound by war or truce, begin the reconquest. Both states will write Chinese unification into their war aims."
 button_mgn_launch_qing_conquest: "Launch Armed Unification"
 button_mgn_launch_qing_conquest_desc: "If Qing has overtaken Ming and neither side is bound by war or truce, move to settle the overseas court by force. Both states will fight in the name of Chinese unification."
 button_mgn_claim_ming_reconquest_complete: "All Under One Realm"
 button_mgn_claim_ming_reconquest_complete_desc: "Qing has passed into history; Ming can begin rebuilding the state order after unification."
 button_mgn_claim_qing_conquest_complete: "All Under One Realm"
 button_mgn_claim_qing_conquest_complete_desc: "The African Ming court has been subdued; Qing can begin settling the former overseas realm."
 button_mgn_recognize_brotherly_hierarchy: "Propose Imperial Amity"
 button_mgn_recognize_brotherly_hierarchy_desc: "When both courts still preserve monarchical, theocratic, or social-monarchic principles, the stronger claimant may turn advantage into ritual hierarchy and demand tributary or vassal status."
 button_mgn_request_open_migration: "Demand Free Migration"
 button_mgn_request_open_migration_desc: "Demand that the other China abolish migration controls, reopening passes, markets, and family routes. If the weaker court refuses, the statutes will be settled by war."
 button_mgn_request_regulated_migration: "Demand Migration Statutes"
 button_mgn_request_regulated_migration_desc: "Demand that the other China regulate migration through registers, passes, and official statutes. Refusal is a rejection of this court's authority to set the frontier order."
 button_mgn_request_closed_migration: "Demand Closed Borders"
 button_mgn_request_closed_migration_desc: "Demand that the other China close its borders and stop unauthorized movement. If the frontier stays open, the dispute moves from registers to war declarations."
 button_mgn_launch_peaceful_unification: "Propose Peaceful Unification"
 button_mgn_launch_peaceful_unification_desc: "Propose merger when relations are amicable, the political systems are compatible, and rank has settled the stronger claimant. Monarchies, social monarchies, and corporate states may merge with one another as long as both are electoral or both non-electoral; their exact laws need not match. Landed, wealth, census, universal, and single-party voting all count as electoral. Other governments must have the exact same governance principle. A subject China must first serve for five cumulative years."
 button_mgn_request_independence: "Demand Independence"
 button_mgn_request_independence_desc: "When war, diplomatic plays, and truce obligations have faded, declare that this court will no longer keep peace as another China's subject."
 mgn_can_claim_ming_reconquest_complete_tt: "Asian Qing no longer exists"
 mgn_can_claim_qing_conquest_complete_tt: "African Ming no longer exists, and Qing remains the valid Chinese central government"
 mgn_can_request_independence_from_other_china_tt: "The subject and overlord are both at peace and outside diplomatic plays, and neither side has a truce with the other"
 mgn_tt_two_chinas_peace_tt: "Both states are at peace and outside diplomatic plays"
 mgn_tt_two_chinas_no_truce_tt: "Neither side has a truce with the other"
 mgn_tt_higher_rank_than_other_china_tt: "This country has a higher rank than the other China"
 mgn_tt_no_force_unification_in_progress_tt: "No unification war demand awaits resolution"
 mgn_tt_ritual_monarchies_not_subjects_tt: "Both states retain monarchical, theocratic, or social-monarchic principles, and neither is subject to the other"
 mgn_tt_no_brotherly_hierarchy_in_progress_tt: "No imperial amity proposal awaits an answer"
 mgn_tt_amicable_and_unifiable_government_tt: "Relations are amicable; monarchies, social monarchies, and corporate states may merge with one another, but both must be electoral or both non-electoral (landed, wealth, census, universal, and single-party voting count as electoral); other governments need the exact same governance principle"
 mgn_tt_rank_or_five_year_subject_union_tt: "This country has the higher rank; if the other China is a subject, it must have served for five cumulative years"
 mgn_tt_no_peaceful_unification_in_progress_tt: "No peaceful unification proposal awaits an answer"
 mgn_tt_rank_or_overlord_for_migration_tt: "This country either outranks or overlords the other China"
 mgn_tt_migration_policy_differs_tt: "The two countries have different migration laws"
 mgn_tt_no_migration_policy_alignment_in_progress_tt: "No migration-statute demand awaits an answer"
 mgn_chinese_chartered_company_cannot_form_china_tt: "#bold Chinese chartered companies#! cannot form China"
 button_mgn_move_capital_beijing: "Move Capital to Beijing"
 button_mgn_move_capital_beijing_desc: "Move the capital and market capital to Beijing, returning the court to the old northern axis of Chinese rule."
 button_mgn_move_capital_nanjing: "Move Capital to Nanjing"
 button_mgn_move_capital_nanjing_desc: "Move the capital and market capital to Nanjing, where the old southern capital can bind home documents to overseas memory."
 button_mgn_move_capital_yingtian: "Move Capital to Yingtian"
 button_mgn_move_capital_yingtian_desc: "Move the capital and market capital to Yingtian in Lower Egypt, declaring that the Nile can also be the center of the realm."
 button_mgn_establish_african_company_ming: "Establish African Revenue Company"
 button_mgn_establish_african_company_ming_desc: "If the court has left Africa while still holding land there, entrust its old foundation to the African Revenue Company. Han officials and merchants govern alongside African and Western Han communities under Heavenly Subjects and an extractive economy."
 button_mgn_establish_african_company_qing: "Establish African Revenue Company"
 button_mgn_establish_african_company_qing_desc: "If Qing controls African lands but does not wish to fold them into ordinary provinces, charter the African Revenue Company. Han officials and merchants govern alongside the region's emerging Sinitic communities to collect revenue, conduct trade, and keep order."
 button_mgn_establish_mainland_company: "Establish Interior Administration Company"
 button_mgn_establish_mainland_company_desc: "Create a Han administration company to manage revenue, mines, passes, and roads across the Chinese interior and its northwestern and northeastern marches, stitching the old realm together with accounts."
 button_mgn_establish_korean_company: "Establish Eastern Tributary Revenue Company"
 button_mgn_establish_korean_company_desc: "Create the Eastern Tributary Revenue Company to manage Korean taxes, ports, and tributary affairs. Han officials and merchants join Haedong Han gentry in company offices, carrying the old rites into new customs records and statutes."
 button_mgn_establish_lanfang_company: "Establish Lanfang Revenue Company"
 button_mgn_establish_lanfang_company_desc: "Create the Lanfang Revenue Company to bring Bornean ports, mines, and kongsi trade roads under imperial charter. Han merchants and Nanyang Han bind merchant compacts and local alliances into the company ledger."
 button_mgn_establish_siberian_company: "Establish Siberian Revenue Company"
 button_mgn_establish_siberian_company_desc: "Create the Siberian Revenue Company to manage the northern frontier through posts, mines, furs, and settlement. Han officials and merchants govern alongside Shuofang Han communities; Tuva remains in the Interior Administration scope."
 button_mgn_restore_northeastern_border: "Restore the Northeastern Border"
 button_mgn_restore_northeastern_border_desc: "The old northeastern marches lie scattered among the tributaries. Reorder their registers under a surviving Qing, the Interior Administration Company, or direct Ming rule, in that order."
 button_mgn_restore_northwestern_border: "Restore the Northwestern Border"
 button_mgn_restore_northwestern_border_desc: "The northwestern marches have long been divided among tributaries. Restore the old registers under a surviving Qing, the Interior Administration Company, or direct Ming rule, in that order, including Qing's former portion of Kirghizia."
 mgn_restore_northeastern_border_effect_tt: "Reorder the northeastern registers: Outer Manchuria and Amur pass first to Qing, then to the Interior Administration Company if Qing no longer exists, and finally to direct Ming rule if neither exists."
 mgn_restore_northwestern_border_effect_tt: "Reorder the northwestern registers: the old frontier passes first to Qing, then to the Interior Administration Company if Qing no longer exists, and finally to direct Ming rule if neither exists. Kirghizia retains its 1836 division."
 button_mgn_establish_central_asian_company: "Establish Central Asian Revenue Company"
 button_mgn_establish_central_asian_company_desc: "Create the Central Asian Revenue Company to administer oases, caravan roads, mines, and canals. Han officials and merchants join Tianshan Han communities in binding local roots, Confucian rites, and company accounts."
 button_mgn_establish_japanese_company: "Establish Fusang Revenue Company"
 button_mgn_establish_japanese_company_desc: "Charter the Fusang Revenue Company over the Japanese home islands from Hokkaido to Kyushu. Han officials and merchants work with Japanese-speaking Fusang Han to connect warrior houses, merchant associations, and city offices to the imperial order; overlord-controlled Ryukyu follows the Interior Administration Company instead."
 button_mgn_establish_southeast_asian_company: "Establish Southern Seas Administration Company"
 button_mgn_establish_southeast_asian_company_desc: "Charter the Southern Seas Administration Company over Burma, Siam, Laos, Cambodia, Vietnam, and Malaya. Han officials and merchants work with Vietnamese-speaking Jiaonan Han to interpret old institutions through Confucian documents and company trade; Borneo remains under Lanfang."
 mgn_has_african_company_land_tt: "This country or a non-company government within its subject hierarchy controls African territory"
 mgn_has_mainland_company_land_tt: "This country or a non-company government within its subject hierarchy controls territory in the interior, Kirghizia, Ili, Tuva, Tibet, Sakhalin, or Ryukyu"
 mgn_has_korean_company_land_tt: "This country or a non-company government within its subject hierarchy controls Korean territory"
 mgn_has_lanfang_company_land_tt: "This country or a non-company government within its subject hierarchy controls Bornean territory"
 mgn_has_siberian_company_land_tt: "This country or a non-company government within its subject hierarchy controls Siberian territory outside Tuva"
 mgn_has_central_asian_company_land_tt: "This country or a non-company government within its subject hierarchy controls Central Asian territory"
 mgn_has_japanese_company_land_tt: "This country or a non-company government within its subject hierarchy controls territory in the Japanese home islands outside Ryukyu"
 mgn_has_southeast_asian_company_land_tt: "This country or a non-company government within its subject hierarchy controls territory in mainland Southeast Asia or Malaya"
 mgn_capital_not_in_africa_tt: "The capital is outside Africa"
 mgn_capital_not_in_mainland_company_region_tt: "The capital is outside the interior administration region"
 mgn_capital_not_in_korean_company_region_tt: "The capital is outside Korea"
 mgn_capital_not_in_lanfang_company_region_tt: "The capital is outside Borneo"
 mgn_capital_not_in_siberian_company_region_tt: "The capital is outside the Siberian administration region"
 mgn_capital_not_in_central_asian_company_region_tt: "The capital is outside the Central Asian administration region"
 mgn_capital_not_in_japanese_company_region_tt: "The capital is outside the Japanese home islands (Ryukyu excluded)"
 mgn_capital_not_in_southeast_asian_company_region_tt: "The capital is outside the Southern Seas administration region"
 mgn_establish_african_company_effect_tt: "Issue a charter to the African Revenue Company; territory within its chartered scope is transferred and incorporated."
 mgn_establish_mainland_company_effect_tt: "Issue a charter to the Interior Administration Company; territory within its chartered scope is transferred and incorporated."
 mgn_establish_korean_company_effect_tt: "Issue a charter to the Eastern Tributary Revenue Company; territory within its chartered scope is transferred and incorporated."
 mgn_establish_lanfang_company_effect_tt: "Issue a charter to the Lanfang Revenue Company; territory within its chartered scope is transferred and incorporated."
 mgn_establish_siberian_company_effect_tt: "Issue a charter to the Siberian Revenue Company; territory within its chartered scope is transferred and incorporated."
 mgn_establish_central_asian_company_effect_tt: "Issue a charter to the Central Asian Revenue Company; territory within its chartered scope is transferred and incorporated."
 mgn_establish_japanese_company_effect_tt: "Issue a charter to the Fusang Revenue Company; Japanese home-island territory within its scope is transferred and incorporated."
 mgn_establish_southeast_asian_company_effect_tt: "Issue a charter to the Southern Seas Administration Company; mainland Southeast Asian and Malayan territory within its scope is transferred and incorporated."

 mgn_route_events.10.t: "All Under One Realm"
 mgn_route_events.10.d: "Qing no longer exists, and Ming is the only state left able to claim Chinese legitimacy."
 mgn_route_events.10.f: "The court once dismissed as overseas now writes its edicts back into the realm. Victory does not restore the old order by itself; palaces, registers, borders, and titles must all be arranged again."
 mgn_route_events.10.a: "Give the realm its order."
 mgn_route_events.20.t: "All Under One Realm"
 mgn_route_events.20.d: "Qing has subdued the African Ming, ending the overseas claimant's independence."
 mgn_route_events.20.f: "The old challenger across the Indian Ocean now bows to Qing. Africa, however, cannot become ordinary provinces by proclamation alone; the court must decide how to inherit its institutions, collect its revenues, and hold the distant frontier."
 mgn_route_events.20.a: "Settle the overseas realm."
 mgn_route_events.30.t: "Capital in Beijing"
 mgn_route_events.30.d: "Ming has moved its capital back to Beijing."
 mgn_route_events.30.f: "Palaces, ministries, and archives return to the old northern capital. Beijing turns the overseas centuries into a long exile finally brought to an end."
 mgn_route_events.30.a: "So it is settled."
 mgn_route_events.31.t: "Capital in Nanjing"
 mgn_route_events.31.d: "Ming has moved its capital to Nanjing."
 mgn_route_events.31.f: "The old southern capital once again anchors the dynasty, binding northern claims, overseas memory, river grain, and sea lanes into one court."
 mgn_route_events.31.a: "So it is settled."
 mgn_route_events.32.t: "Capital in Yingtian"
 mgn_route_events.32.d: "Ming has fixed its capital at Yingtian in Lower Egypt."
 mgn_route_events.32.f: "The court does not surrender Africa to exile or memory. The Nile, the Red Sea routes, Saharan posts, and new palace walls are written into the royal domain. China proper now stands not only between Yellow River and Yangtze, but also at the gates of Yingtian."
 mgn_route_events.32.a: "This too is the center."
 mgn_route_events.40.t: "African Revenue Company"
 mgn_route_events.40.d: "Ming has placed the old African realm under the African Revenue Company."
 mgn_route_events.40.f: "The registers, tax rolls, and local networks of the old field administration remain, but now they bear a company seal. Han officials and merchants govern alongside African and Western Han communities as land, labor, and trade routes pass under a stricter revenue charter."
 mgn_route_events.40.a: "Issue the charter."
 mgn_route_events.50.t: "African Revenue Company"
 mgn_route_events.50.d: "Qing has placed the former African realm under the African Revenue Company."
 mgn_route_events.50.f: "Even after unification, Africa remains distant across sea routes, deserts, and unfamiliar local orders. Han officials and merchants enter company offices alongside the region's emerging Sinitic communities to manage revenue, trade routes, and frontier order."
 mgn_route_events.50.a: "Issue the charter."
 mgn_route_events.140.t: "Interior Administration Company"
 mgn_route_events.140.d: "The court has entrusted selected interior territories to the Interior Administration Company."
 mgn_route_events.140.f: "Passes, granaries, mines, and customs houses enter a new company charter. Han officials and merchants still act in the Heavenly Court's name, but accounts, capital, and contracts now bind the old provinces."
 mgn_route_events.140.a: "Administer the interior by charter."
 mgn_route_events.141.t: "Eastern Tributary Revenue Company"
 mgn_route_events.141.d: "The court has entrusted the Korean circuits to the Eastern Tributary Revenue Company."
 mgn_route_events.141.f: "The Korean circuits will no longer be held by ritual alone. Han officials and merchants join Haedong Han gentry in company offices, folding ports, tribute roads, and tax registers into imperial administration while writing local institutions into the new charter."
 mgn_route_events.141.a: "Set the eastern marches in order."
 mgn_route_events.144.t: "Lanfang Revenue Company"
 mgn_route_events.144.d: "The court has entrusted Bornean holdings to the Lanfang Revenue Company."
 mgn_route_events.144.f: "Bornean ports, mines, and kongsi trade roads are placed under company management. Han merchants and Nanyang Han bind old merchant compacts and local alliances to a new imperial charter and write them into a single ledger."
 mgn_route_events.144.a: "Administer the southern seas."
 mgn_route_events.142.t: "Siberian Revenue Company"
 mgn_route_events.142.d: "The court has entrusted northern territories to the Siberian Revenue Company."
 mgn_route_events.142.f: "Snowfields, taiga, and cold-sea ports are bound into a frontier ledger. Han officials and merchants govern alongside Shuofang Han communities around posts, mines, and river valleys, sustaining the northern order through ritual, fur trade, and settlement; Tuva remains outside the charter."
 mgn_route_events.142.a: "Administer Siberia."
 mgn_route_events.143.t: "Central Asian Revenue Company"
 mgn_route_events.143.d: "The court has entrusted Central Asian territories to the Central Asian Revenue Company."
 mgn_route_events.143.f: "Oases, steppe, and old caravan roads are handed to company offices. Han officials and merchants join Tianshan Han communities in giving court rites local roots, while ledgers count caravans, mines, and canals."
 mgn_route_events.143.a: "Administer Central Asia."
 mgn_route_events.145.t: "Fusang Revenue Company"
 mgn_route_events.145.d: "The court has entrusted its holdings in the Japanese home islands to the Fusang Revenue Company."
 mgn_route_events.145.f: "From Hokkaido to Kyushu, ports, castle towns, and merchant associations enter one charter. Han officials and merchants join Japanese-speaking Fusang Han in preserving local institutions, placing warrior rank, city ledgers, and imperial seals on the same document; overlord-controlled Ryukyu follows the Interior Administration Company instead."
 mgn_route_events.145.a: "Administer Fusang."
 mgn_route_events.146.t: "Southern Seas Administration Company"
 mgn_route_events.146.d: "The court has entrusted its holdings in mainland Southeast Asia and Malaya to the Southern Seas Administration Company."
 mgn_route_events.146.f: "Customs houses from the Irrawaddy to the Red River enter one charter. Han officials and merchants join Vietnamese-speaking Jiaonan Han in interpreting old institutions through Confucian documents, while company shipping links inland trade to the Strait of Malacca."
 mgn_route_events.146.a: "Administer the Southern Seas."
 mgn_route_events.60.t: "Brotherly Imperial Amity"
 mgn_route_events.60.d: "The two Chinas have recognized a ritual hierarchy."
 mgn_route_events.60.f: "The documents call it brotherly imperial amity. The true balance between the courts is wrapped in ceremony, while defeat and submission become a hierarchy that still preserves the dignity of kindred dynasties."
 mgn_route_events.60.a: "Observe the rites."
 mgn_route_events.100.t: "Peaceful Unification Proposal"
 mgn_route_events.100.d: "Ming proposes peaceful unification."
 mgn_route_events.100.f: "Their governments have converged, and old hostility has eased. The African court argues that China no longer needs two administrations, two armies, and two proclamations of legitimacy."
 mgn_route_events.100.a: "Accept unification."
 mgn_route_events.100.b: "Refuse and prepare for war."
 mgn_route_events.101.t: "Peaceful Unification Proposal"
 mgn_route_events.101.d: "Qing proposes peaceful unification."
 mgn_route_events.101.f: "Their governments have converged, and old hostility has dulled. Beijing argues that the overseas Ming court can enter a united state without another war."
 mgn_route_events.101.a: "Accept unification."
 mgn_route_events.101.b: "Refuse and prepare for war."
 mgn_route_events.110.t: "Brotherly Imperial Amity"
 mgn_route_events.110.d: "Ming asks Qing to accept tributary or vassal status as ritual hierarchy."
 mgn_route_events.110.f: "The envoy turns strength into ritual and submission into brotherly amity. Acceptance preserves the ancestral name; refusal leaves the matter to armies."
 mgn_route_events.110.a: "Accept imperial amity."
 mgn_route_events.110.b: "Refuse and prepare for war."
 mgn_route_events.111.t: "Brotherly Imperial Amity"
 mgn_route_events.111.d: "Qing asks Ming to accept tributary or vassal status as ritual hierarchy."
 mgn_route_events.111.f: "The envoy turns strength into ritual and submission into brotherly amity. Acceptance preserves the ancestral name; refusal leaves the matter to armies."
 mgn_route_events.111.a: "Accept imperial amity."
 mgn_route_events.111.b: "Refuse and prepare for war."
 mgn_route_events.120.t: "Border Migration Policy Demand"
 mgn_route_events.120.d: "Ming demands that Qing change its border migration policy."
 mgn_route_events.120.f: "The African court argues that the stronger claimant to Chinese legitimacy should set the laws governing movement across the frontier."
 mgn_route_events.120.a: "Adopt Ming migration policy."
 mgn_route_events.120.b: "Refuse and prepare for war."
 mgn_route_events.121.t: "Border Migration Policy Demand"
 mgn_route_events.121.d: "Qing demands that Ming change its border migration policy."
 mgn_route_events.121.f: "The Beijing court argues that the stronger claimant to Chinese legitimacy should set the laws governing movement across the frontier."
 mgn_route_events.121.a: "Adopt Qing migration policy."
 mgn_route_events.121.b: "Refuse and prepare for war."
 mgn_migration_policy_alignment_rejected: "Border Migration Policy Dispute"
 mgn_route_events.130.t: "A Bitter Peace"
 mgn_route_events.130.d: "This court now lives under the overlordship of the rival Chinese court."
 mgn_route_events.130.f: "The documents still speak of brotherhood, but the hierarchy is written plainly enough. This peace may hold, yet it is not sweet."
 mgn_route_events.130.a: "Endure, and wait."
 mgn_independence_demand: "Two Chinas Independence Demand"

 law_mgn_revolutionary_committees: "Revolutionary Committees"
 law_mgn_revolutionary_committees_desc: "The former administrative organs can no longer meet the needs of continuous revolution. Revolutionary cadres, mass representatives, and delegates of the armed forces form three-in-one committees exercising unified political and administrative authority. Every mass faction may join the grand revolutionary alliance and reach agreement after identifying the correct line. Revolution must not stop at government offices: factories, mines, and everyone in high office must also submit to mass supervision."
 mgn_revolutionary_committees_special_unlocks_tt: "Permits enactment of #bold Factory Councils#! and unlocks the #bold Struggle Session#! interaction on domestic characters; Struggle Session is shown only while Revolutionary Committees are active"
 mgn_factory_councils_revolutionary_or_committees_tt: "The country is revolutionary or has enacted Revolutionary Committees"

 law_mgn_national_tutelage: "National Tutelage"
 law_mgn_national_tutelage_desc: "The revolution is not yet complete, nor is constitutional government ready. The National Government unites party, state, and armed forces, tutors the people in the exercise of political rights, and prepares the Executive, Legislative, Judicial, Examination, and Control branches prescribed by the Five-Power Constitution. Tutelage shall end once local self-government is complete and the citizenry is ready to exercise sovereignty; the Central Executive Committee will determine when that day has arrived."
 mgn_national_tutelage_special_unlocks_tt: "Unlocks the #bold Period of Political Tutelage#! Journal Entry, allowing the government to declare or lift #bold nationwide martial law#!; regular elections are postponed while martial law remains active"
 je_mgn_national_tutelage: "Period of Political Tutelage"
 je_mgn_national_tutelage_reason: "The National Government is tutoring the people in political rights while preparing future constitutional government under the Five-Power Constitution. Nationwide martial law may be declared during an emergency, postponing regular elections until it is lifted. The expected end date of the emergency remains to be announced; every review so far has confirmed its continued necessity."
 button_mgn_declare_martial_law: "Declare Nationwide Martial Law"
 button_mgn_declare_martial_law_desc: "The domestic and international situation remains grave. The government will enter a Period of Mobilization for the Suppression of Rebellion, postponing regular elections until a restoration date is announced. Martial law must remain in force for at least two years."
 button_mgn_lift_martial_law: "Lift Nationwide Martial Law"
 button_mgn_lift_martial_law_desc: "The country is now fully prepared to resume regular elections. Lift martial law and hold an election in six months to test the achievements of tutelage. Martial law cannot be declared again for two years."
 mgn_tt_not_in_election_campaign: "The country is not currently in an election campaign"
 mgn_tt_martial_law_reimposition_ready: "At least two years have passed since martial law was lifted"
 mgn_tt_martial_law_minimum_elapsed: "Martial law has remained in force for at least two years"
 mgn_tt_not_in_civil_war: "The country is not fighting a civil war"
 mgn_tt_no_revolution_brewing: "No revolution is currently brewing"
 mgn_mobilization_period: "Period of Mobilization for the Suppression of Rebellion"
 mgn_mobilization_period_desc: "Martial law does not suspend political tutelage; it removes the obstacles preventing the people from receiving it. Regular elections are postponed until the emergency has ended."

 mgn_struggle_session: "Struggle Session"
 mgn_struggle_session_desc: "#lore Mobilize the masses to expose and criticize the erroneous line pursued by [Character.GetFullName]. The struggle session will end [Character.GetHerHis] political career, but once a mass movement begins, its outcome is no longer entirely under the revolutionary committee's control.#!\n\n@warning! The target will be removed, exiled, or killed during the struggle session; the exact outcome cannot be predicted."
 mgn_revolutionary_committee_events.1.t: "Down with [SCOPE.sCharacter('mgn_struggle_target').GetFullName]!"
 mgn_revolutionary_committee_events.1.d: "After several days of criticism, [SCOPE.sCharacter('mgn_struggle_target').GetFullName] has admitted to grave errors of political line. The assembly promptly removes [SCOPE.sCharacter('mgn_struggle_target').GetHerHim] from every post and orders [SCOPE.sCharacter('mgn_struggle_target').GetHerHim] to rediscover the masses through labor. The revolutionary committee sees no reason to let technical details obstruct a question of principle."
 mgn_revolutionary_committee_events.1.a: "The revolutionary masses see clearly."
 mgn_revolutionary_committee_events.2.t: "Protective Isolation"
 mgn_revolutionary_committee_events.2.d: "The struggle session has exceeded its organizers' expectations. To protect the revolution—and to protect [SCOPE.sCharacter('mgn_struggle_target').GetFullName] from further spontaneous protection by the revolutionary masses—the committee transfers [SCOPE.sCharacter('mgn_struggle_target').GetHerHim] to an undisclosed location for examination."
 mgn_revolutionary_committee_events.2.a: "This protection is necessary."
 mgn_revolutionary_committee_events.3.t: "Righteous Indignation of the Masses"
 mgn_revolutionary_committee_events.3.d: "The hall descended briefly into disorder during the struggle session. When order was restored, [SCOPE.sCharacter('mgn_struggle_target').GetFullName] showed no signs of life. The revolutionary committee states that no necessary connection exists between this unfortunate outcome and the masses' normal expression of revolutionary indignation."
 mgn_revolutionary_committee_events.3.a: "Revolution is not a dinner party."
 mgn_revolutionary_committee_events.4.t: "Bombard the Headquarters"
 mgn_revolutionary_committee_events.4.d: "Big-character posters bearing the name of [SCOPE.sCharacter('mgn_struggle_target').GetFullName] cover the capital. Supporters hail a triumph of continuous revolution; critics ask that if the masses may depose the highest official at any time, who authorized the official who authorized the masses?"
 mgn_revolutionary_committee_events.4.a: "Do not be intimidated by office."

