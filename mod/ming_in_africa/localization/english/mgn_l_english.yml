 dp_mgn_unify_china_tooltip: "#header $dp_mgn_unify_china$#!\n$TOOLTIP_DELIMITER$\nStart a diplomatic play to force another Chinese state into Ming."
 dp_mgn_two_chinas_unification: "Two Chinas Unification War"
 dp_mgn_brotherly_subjugation: "Brotherly Imperial Amity"
 dp_mgn_brotherly_subjugation_desc: "Invoke shared imperial lineage and tributary ritual to force the other Chinese state into tributary or vassal status."
